<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقارير القرشي</title>
<!-- xlsx-js-style = نفس SheetJS 0.18.5 بالظبط + دعم تنسيق الخلايا (ألوان/برواز/تجميد).
     القراءة والكتابة ما اتغيروش، اللي زاد هو خاصية s على الخلية. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{
  --blue:#1d4ed8; --blue-d:#173fb0; --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef2fb;
  --border:#dbe3f3; --text:#1b2436; --muted:#6b7690; --danger:#dc2626; --ok:#16a34a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--bg:#10131c;--panel:#181c28;--panel2:#20263a;--border:#2b3350;--text:#e7ebf5;--muted:#8b93ac} }
:root[data-theme="dark"]{--bg:#10131c;--panel:#181c28;--panel2:#20263a;--border:#2b3350;--text:#e7ebf5;--muted:#8b93ac}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
header{background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:20}
header h1{font-size:16px;margin:0;font-weight:700}
header .ver{font-size:10px;opacity:.75}
nav{display:flex;gap:4px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--border);
  overflow-x:auto;flex-shrink:0;z-index:19}
.nav-btn{flex:0 0 auto;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);
  color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.nav-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
main{flex:1;overflow-y:auto;padding:10px}
.mod{display:none}
.mod.active{display:block}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;
  display:flex;align-items:center;gap:8px}
.card .info{flex:1;min-width:0}
/* لوح عادي (مش صف) — .card نفسها flex فأي محتوى جواها بيتقسم أعمدة */
.panelbox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;display:block}
.card .name{font-weight:700;font-size:14px}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.act{display:flex;gap:6px}
.act button{border:none;background:var(--panel2);width:32px;height:32px;border-radius:8px;font-size:14px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:13.5px}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;
  background:var(--blue);color:#fff;font-size:24px;border:none;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:25;cursor:pointer}
.impbar{display:flex;gap:8px;margin-bottom:10px}
.impbar label,.impbar button{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-size:12.5px;font-weight:700;
  background:var(--panel2);border:1px solid var(--border);color:var(--text);cursor:pointer}
.grp{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--panel)}
.grp-h{display:flex;align-items:center;justify-content:space-between;padding:12px;cursor:pointer;font-weight:700;font-size:13.5px}
.grp-h .cnt{font-weight:400;color:var(--muted);font-size:12px}
.grp-h .arrow{transition:transform .2s;color:var(--muted)}
.grp.open .grp-h .arrow{transform:rotate(180deg)}
.grp-body{display:none;padding:0 8px 8px}
.grp.open .grp-body{display:block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:50}
.overlay.show{display:flex}
.sheet{background:var(--panel);width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:15px}
.f-row{margin-bottom:10px}
.f-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f-row input,.f-row select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px}
.f-actions{display:flex;gap:8px;margin-top:14px}
.f-actions button{flex:1;padding:12px;border-radius:9px;border:none;font-size:14px;font-weight:700;cursor:pointer}
.btn-save{background:var(--blue);color:#fff}
.btn-cancel{background:var(--panel2);color:var(--text);border:1px solid var(--border) !important}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:#1b2436;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.warn{background:#fff4e5;color:#8a5a00;border:1px solid #f0c36d;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:10px}
@media (prefers-color-scheme:dark){ .warn{background:#332a12;color:#f0c36d;border-color:#5a4a1f} }
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:8px 12px;margin:0 6px 8px 0;font-size:12.5px;cursor:pointer}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
table.rep{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel);border-radius:10px;overflow:hidden}
table.rep th,table.rep td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:center}
table.rep th{background:var(--panel2);font-size:11.5px}
table.rep td:first-child,table.rep th:first-child{text-align:right}
table.rep.stk{width:max-content;min-width:100%;overflow:visible}
table.rep.stk td:first-child,table.rep.stk th:first-child{position:sticky;right:0;z-index:1;background:var(--panel);min-width:130px;max-width:160px}
table.rep.stk th:first-child{background:var(--panel2)}
.qs{display:flex;gap:10px;font-size:12px;align-items:center;flex-wrap:wrap}
.qs small{color:var(--muted)}
.grp-h>span:first-child{flex:1;min-width:0}
.grp-h{gap:8px}
.ddrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.dd{position:relative;min-width:0}
.dd summary,.dd .ddoff{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 26px 8px 10px;display:flex;flex-direction:column;gap:2px;position:relative}
.dd .ddoff{cursor:default;opacity:.7}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:'▾';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ddl{font-size:11px;color:var(--muted)}
.ddv{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddp{position:absolute;top:calc(100% + 4px);z-index:30;width:min(330px,88vw);max-height:52vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px}
.ddp label{display:flex;align-items:center;gap:8px;padding:10px 8px;font-size:13.5px;border-bottom:1px solid var(--border)}
.ddp label:last-child{border-bottom:none}
.ddp input[type=checkbox]{width:18px;height:18px;flex-shrink:0}
.ddact{display:flex;gap:6px;padding:2px 2px 8px;position:sticky;top:0;background:var(--panel);z-index:1}
.ddact button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:12px;font-weight:700}
</style>
</head>
<body>
<header><h1><img id="hdrLogo" alt="ELKORASHI" style="height:26px;width:auto;background:#fff;border-radius:6px;padding:2px 5px;vertical-align:middle;margin-inline-end:8px"> تقارير القرشي</h1><span style="display:flex;align-items:center;gap:8px"><span class="ver">v3.0</span><span id="syncPill" title="حالة المزامنة" onclick="syncNow(false)" style="font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.18);cursor:pointer">☁️</span><button id="syncBtn" title="إعدادات المزامنة" onclick="openSyncSheet()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;width:28px;height:28px;font-size:14px;cursor:pointer">⚙️</button><button id="refreshBtn" title="تحديث" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;width:28px;height:28px;font-size:14px;cursor:pointer">🔄</button></span></header>
<nav id="nav"></nav>
<main id="main"></main>
<button class="fab" id="fab">+</button>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

function lsBytes(k){ try{ return ((localStorage.getItem(k)||'').length + k.length) * 2; }catch(e){ return 0; } }
function lsTotal(){ let n = 0; try{ for(const k of Object.keys(localStorage)) n += lsBytes(k); }catch(e){} return n; }
function fmtKB(n){ return n > 1048576 ? (n/1048576).toFixed(1) + ' ميجا' : Math.round(n/1024) + ' كيلو'; }

// بيمسح بيانات التطبيق القديم من الجهاز. بيرجع عدد المفاتيح والمساحة اللي اتفضت.
function cleanOldAppStorage(){
  let n = 0, bytes = 0;
  try{
    for(const k of Object.keys(localStorage)){
      if(!isOldAppKey(k)) continue;
      bytes += lsBytes(k); localStorage.removeItem(k); n++;
    }
  }catch(e){}
  return {n, bytes};
}
// أقدم النسخ الاحتياطية بتتشال الأول لما المساحة تضيق
function pruneBackups(keepNewest){
  const bks = [];
  try{ for(const k of Object.keys(localStorage)) if(k.indexOf('_backup_') === 0) bks.push(k); }catch(e){}
  bks.sort();
  let n = 0;
  for(const k of bks.slice(0, Math.max(0, bks.length - (keepNewest||0)))){
    try{ localStorage.removeItem(k); n++; }catch(e){}
  }
  return n;
}
function save(k,v){
  const str = JSON.stringify(v);
  try{ localStorage.setItem(k, str); }
  catch(e){
    // المساحة اتملت — ننضف اللي مش لازم ونعيد المحاولة قبل ما نفشّل
    const freed = cleanOldAppStorage();
    let saved = false;
    try{ localStorage.setItem(k, str); saved = true; }catch(e2){}
    if(!saved){ pruneBackups(2); try{ localStorage.setItem(k, str); saved = true; }catch(e3){} }
    if(!saved){
      toast('مساحة المتصفح اتملت — افتح ⚙️ ودوس «نضّف مساحة الجهاز»');
    } else if(freed.n){
      toast('اتحفظ · اتفضى ' + fmtKB(freed.bytes) + ' من التطبيق القديم');
    }
  }
  // أي مفتاح بيانات بياخد ختم جديد عشان المزامنة تعرف إنه اتغيّر عندنا
  try{ if(typeof bumpRev === 'function' && SYNC_KEYS.indexOf(k) >= 0) bumpRev(k); }catch(e){}
}

/* ════════════════ المزامنة بين الأجهزة ════════════════
   المبدأ اللي المرة اللي فاتت اتلخبطت بسببه: **الجهاز مش بيكتب فوق غيره من
   غير ما يعرف**. فكل مفتاح بيانات ليه «ختم» (رقم بيكبر مع كل تعديل)، والمزامنة
   بتقارن ختم الجهاز بختم السيرفر:
     • ختم السيرفر أحدث  → ننزّل نسخته.
     • ختم الجهاز أحدث   → نرفع نسختنا.
     • الاتنين اتغيّروا   → الأحدث يكسب، **والقديم بيتحفظ نسخة احتياطية
                            على الجهاز** ونقولك بالاسم إيه اللي اتغيّر.
   البيانات كلها صغيرة (كيلوبايتات) فكل مفتاح بيترفع رفعة واحدة — مفيش تقطيع
   ولا نص بيانات. ولو الشبكة وقعت، المزامنة بتفضل «مستنية» وبتتعاد لوحدها. */

function syncHasData(k){
  let v; try{ v = JSON.parse(localStorage.getItem(k)); }catch(e){ return false; }

  return true;
}

/* ⚠️ الباج اللي كان بيخلّي جهاز مليان بيانات يفضل «بيزامن» وميرفعش ولا صنف:
   المزامنة بتقارن ختم الجهاز بختم السيرفر، والبيانات اللي اتحطت على الجهاز
   **قبل ما المزامنة نفسها تتضاف** مالهاش ختم خالص (syncRevs فاضي). يعني
   mine = 0 و base = 0، فـ iChanged = false — والمزامنة بتعدّي المفتاح على إنه
   «مفيش جديد» وعمرها ما ترفعه. والجهاز التاني يفضل فاضي مهما زامنت.
   (الموبايل كان فيه ١٦٩ صنف والكمبيوتر فاضي — ودي كانت الحكاية.)

   الحل: أول مرة بس، بنختم كل مفتاح **فيه بيانات فعلًا** بختم صغير (١).
   ليه ١ مش الوقت الحالي؟ عشان لو السيرفر أصلاً فيه نسخة متزامنة (ختمها وقت
   حقيقي كبير)، تكسب هي والجهاز ينزّلها — يعني جهاز لسه داخل على المزامنة
   عمره ما يمسح شغل جاهز على السيرفر. ولو السيرفر فاضي (ختمه 0)، الجهاز
   بتاعنا يكسب ويرفع. ده بالظبط اللي إحنا عايزينه في الحالتين. */
(function seedSyncRevs(){
  if(load('_syncSeeded_', false)) return;
  let n = 0;
  for(const k of SYNC_KEYS){
    if(syncRevs[k] || syncPulled[k]) continue;   // متختوم خلاص
    if(!syncHasData(k)) continue;                // فاضي — مفيش حاجة ترفع
    syncRevs[k] = 1; n++;
  }
  if(n){ try{ localStorage.setItem('_syncRevs_', JSON.stringify(syncRevs)); }catch(e){} }
  try{ localStorage.setItem('_syncSeeded_', 'true'); }catch(e){}
})();

// الختم بيكبر دايمًا حتى لو ساعة الجهاز غلط (نفس فكرة ساعة لامبورت)
function bumpRev(key){
  const now = Date.now();
  const last = Math.max(syncRevs[key] || 0, syncPulled[key] || 0);
  syncRevs[key] = Math.max(now, last + 1);
  save('_syncRevs_', syncRevs);
  syncSoon();
}
function syncSoon(){
  if(!syncCfg().url) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=> syncNow(true), 4000);   // بعد ما تبطّل تعديل بـ٤ ثواني
}
/* مهم: من غير مهلة زمنية، أي طلب بيعلّق بيخلّي المزامنة واقفة على «بيزامن...»
   للأبد ومش بتشتغل تاني أبدًا. المهلة بتكبر مع حجم اللي بنبعته. */
async function syncApi(payload, isGet){
  const c = syncCfg();
  const url = c.url + (isGet ? ('?' + new URLSearchParams(Object.assign({token:c.token}, payload))) : '');
  const body = isGet ? '' : JSON.stringify(Object.assign({token:c.token}, payload));
  const opt = isGet ? {} : {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body};
  const timeoutMs = Math.min(240000, 45000 + Math.round(body.length / 1024) * 60);
  let last;
  for(let a = 0; a < 3; a++){                 // الشبكة بتقطع — بنعيد المحاولة
    if(navigator.onLine === false) throw new Error('مفيش نت');
    const ctrl = new AbortController();
    const timer = setTimeout(()=> ctrl.abort(), timeoutMs);
    try{
      const r = await fetch(url, Object.assign({signal: ctrl.signal}, opt));
      if(r.status === 404) throw new Error('HTTP 404 — رابط السكربت مش شغال أو النشر اتغيّر');
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      // «unknown action» = الـPOST اتحوّل GET وضاع جسمه · «busy» = كتابة شغّالة
      if(d && d.ok === false && /unknown action|busy/i.test(d.error || '')) throw new Error(d.error);
      return d;
    }catch(e){
      last = (e && e.name === 'AbortError')
        ? new Error('الطلب عدّى ' + Math.round(timeoutMs/1000) + ' ثانية من غير رد')
        : e;
      if(a < 2) await new Promise(z=> setTimeout(z, 800 * (a + 1)));
    }finally{ clearTimeout(timer); }
  }
  throw last;
}

/* ═══ الدمج الثلاثي على مستوى البند ═══
   قبل كده لو الجهازين لمسوا نفس الملف (whShortage مثلاً) كانت المزامنة تقول
   «تعارض» وتاخد الأحدث كله وتحط التاني نسخة احتياطية — حتى لو كل واحد كان
   بيكتب في صنف مختلف خالص. فكنت تشوف تنبيه كل شوية وانت شغال، وممكن اللي
   كتبته يختفي.
   دلوقتي بنحتفظ بلقطة من آخر نسخة اتزامنت (الأساس)، وبنقارن بند ببند:
     • أنا بس اللي غيّرت البند  → بتاعي يفضل
     • هو بس اللي غيّر البند    → بتاعه ياخد مكانه
     • البند اتشال من ناحية     → يتشال
     • الاتنين غيّروا نفس البند → الأحدث يكسب (وده التعارض الحقيقي الوحيد)
   يعني اتنين بيكتبوا في أصناف مختلفة مابيتعارضوش أصلاً. */
const isPlainObj = v=> v && typeof v === 'object' && !Array.isArray(v);
const sameVal = (a,b)=> JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b);
// مصفوفة كائنات ليها id — بنتعامل معاها كخريطة بالـid
const isIdArray = v=> Array.isArray(v) && v.length && v.every(x=> isPlainObj(x) && x.id !== undefined);

function merge3(mine, theirs, base, mineWins){
  if(sameVal(mine, theirs)) return {val: mine, clash: false};
  if(sameVal(mine, base))   return {val: theirs, clash: false};   // هو بس اللي غيّر
  if(sameVal(theirs, base)) return {val: mine,   clash: false};   // أنا بس اللي غيّرت

  if(isPlainObj(mine) && isPlainObj(theirs)){
    const b = isPlainObj(base) ? base : {};
    const out = {}; let clash = false;
    for(const k of new Set([...Object.keys(mine), ...Object.keys(theirs), ...Object.keys(b)])){
      const hm = Object.prototype.hasOwnProperty.call(mine, k);
      const ht = Object.prototype.hasOwnProperty.call(theirs, k);
      const hb = Object.prototype.hasOwnProperty.call(b, k);
      if(!hm && !ht) continue;                               // اتشال من الاتنين
      if(hb && !hm && sameVal(theirs[k], b[k])) continue;     // أنا شيلته وهو ما لمسوش
      if(hb && !ht && sameVal(mine[k], b[k])) continue;       // هو شاله وأنا ما لمستوش
      if(!hm){ out[k] = theirs[k]; continue; }
      if(!ht){ out[k] = mine[k]; continue; }
      const r = merge3(mine[k], theirs[k], hb ? b[k] : undefined, mineWins);
      out[k] = r.val; clash = clash || r.clash;
    }
    return {val: out, clash};
  }
  if(isIdArray(mine) && isIdArray(theirs)){
    const toMap = a=>{ const m = {}; (a||[]).forEach(x=>{ if(isPlainObj(x) && x.id !== undefined) m[x.id] = x; }); return m; };
    const r = merge3(toMap(mine), toMap(theirs), isIdArray(base) ? toMap(base) : {}, mineWins);
    const order = [], seen = new Set();
    [...mine, ...theirs].forEach(x=>{ const id = x && x.id;
      if(id !== undefined && !seen.has(String(id)) && r.val[id]){ seen.add(String(id)); order.push(r.val[id]); } });
    return {val: order, clash: r.clash};
  }
  if(Array.isArray(mine) && Array.isArray(theirs) && !isIdArray(mine) && !isIdArray(theirs)){
    const bs = Array.isArray(base) ? base : [];
    const out = [...mine];
    theirs.forEach(x=>{ if(!out.some(y=> sameVal(x,y)) && !bs.some(y=> sameVal(x,y))) out.push(x); });
    return {val: out.filter(x=> theirs.some(y=>sameVal(x,y)) || !bs.some(y=>sameVal(x,y)) || mine.some(y=>sameVal(x,y))), clash:false};
  }
  return {val: mineWins ? mine : theirs, clash: true};        // قيمتين مختلفتين في نفس البند
}

async function syncNow(quiet){
  const c = syncCfg();
  if(!c.url){ if(!quiet) toast('اظبط رابط المزامنة من ⚙️ الأول'); return; }
  // لو فيه مزامنة شغّالة دلوقتي، ما نرميش الطلب — نعيده بعدها على طول
  if(syncBusy){ syncAgain = true; return; }
  syncBusy = true; syncAgain = false; syncStatus('☁️ بيزامن...');
  const down = [], up = [], clash = [], merged = [];
  const t0 = Date.now();
  // حارس: لو حصل أي شيء غير متوقع، المزامنة ما تفضلش «مقفولة» على نفسها للأبد
  const guard = setTimeout(()=>{ syncBusy = false; syncStatus('☁️ مش متزامن', 'err'); }, 300000);
  try{
    // ١) فهرس السيرفر: {مفتاح: ختم}
    let idx = {};
    try{
      const r = await syncApi({action:'get', key:SYNC_INDEX}, true);
      if(r && r.ok) idx = JSON.parse(r.value || '{}') || {};
    }catch(e){ if(!/not found/i.test(e.message || '')) throw e; }

    /* مقارنة ثلاثية: نسختي / نسخة السيرفر / آخر نسخة اتزامنت (base).
       المقارنة الثنائية (الأحدث يكسب) كانت هتضيّع تعديل جهاز لو ساعة الجهاز
       التاني مقدمة — دي كانت لخبطة المرة اللي فاتت. */
    /* السيرفر (Apps Script) بطيء: كل طلب من ٤ لـ١٤ ثانية. يعني مزامنة ٨ حاجات
       ممكن تاخد دقيقتين. والموبايل بيوقف الطلبات أول ما الشاشة تتقفل — فلو
       الشغل كله متسجّل في الآخر بس، أي قطع في النص كان بيضيّع المجهود كله
       وتفضل «مستني يترفع» للأبد. دلوقتي كل حاجة بتتسجّل أول ما تخلص. */
    const saveProgress = ()=>{ save('_syncRevs_', syncRevs); save('_syncPulled_', syncPulled); };
    const todo = SYNC_KEYS.filter(k=>{
      const mine = syncRevs[k] || 0, theirs = idx[k] || 0, base = syncPulled[k] || 0;
      return mine > base || theirs > base;
    });
    let doneN = 0;
    for(const k of todo){
      const mine = syncRevs[k] || 0, theirs = idx[k] || 0, base = syncPulled[k] || 0;
      const iChanged = mine > base, theyChanged = theirs > base;
      // بنكتب من غير save() عشان ما يبقاش «تعديل جديد» يترفع تاني
      const setLocal = (val)=>{
        try{ localStorage.setItem(k, JSON.stringify(val)); }catch(e){}
        if(SYNC_VARS[k]) SYNC_VARS[k](val);
        writeBase(k, val);                    // لقطة الأساس للدمج الجاي
      };
      const getServer = async ()=>{
        const r = await syncApi({action:'get', key:SYNC_PREFIX + k}, true);
        if(!r || !r.ok) return undefined;
        const v = JSON.parse(r.value || 'null');
        return v === null ? undefined : v;
      };
      const pull = async ()=>{
        const val = await getServer();
        if(val === undefined) return false;
        setLocal(val);
        syncRevs[k] = theirs; syncPulled[k] = theirs; down.push(k);
        saveProgress();
        return true;
      };
      const pushVal = async (val, rev)=>{
        await syncApi({action:'set', key:SYNC_PREFIX + k, value: JSON.stringify(val)});
        idx[k] = rev;
        /* الفهرس بيتكتب بعد كل حاجة مش في الآخر. لو اتكتبت القيمة والفهرس لأ،
           الأجهزة التانية عمرها ما هتعرف إنها موجودة، وإحنا هنعتبرها مرفوعة
           وما نرفعهاش تاني — يعني تضيع على السيرفر من غير ما حد يشوفها. */
        await syncApi({action:'set', key:SYNC_INDEX, value: JSON.stringify(idx)});
        syncPulled[k] = rev; up.push(k);
        saveProgress();
      };
      syncStatus('☁️ ' + (++doneN) + '/' + todo.length);
      if(iChanged && !theyChanged){ const v = load(k, null); await pushVal(v, mine); writeBase(k, v); }
      else if(!iChanged && theyChanged) await pull();
      else {
        /* الاتنين لمسوا الملف — بنقارن بند ببند بدل ما ناخد ملف ونرمي التاني.
           في الغالب كل واحد كان في صنف مختلف، فالنتيجة دمج نضيف من غير تنبيه. */
        const srv = await getServer();
        const me = load(k, null);
        if(srv === undefined){ await pushVal(me, mine); writeBase(k, me); }
        else {
          const r = merge3(me, srv, readBase(k), mine >= theirs);
          const rev = Math.max(mine, theirs) + 1;
          if(r.clash){ save('_backup_' + k + '_' + mine, me); clash.push(k); }
          setLocal(r.val);
          syncRevs[k] = rev;
          await pushVal(r.val, rev);
          merged.push(k);
        }
      }
    }
    saveProgress();
    save('_syncAt_', Date.now()); save('_syncErr_', '');
    syncStatus('☁️ ' + new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}), 'ok');
    if(down.length || merged.length) render(true);
    if(!quiet || down.length || up.length || clash.length){
      toast(`مزامنة: نزّل ${down.length} · رفع ${up.length}` + (merged.length ? ` · دمج ${merged.length}` : ''));
    }
    /* من غير alert: كان بيقطع عليك الكتابة في نص الشغل. التعارض الحقيقي بقى
       نادر أصلاً بعد الدمج بند ببند، وبيتسجّل في ⚙️ لو حبيت تراجعه. */
    if(clash.length){
      save('_lastClash_', {at: Date.now(), keys: clash});
      toast('اتدمج الشغل من الجهازين · ' + clash.length + ' بند اتاخد الأحدث فيه');
    }
  }catch(e){
    syncStatus('☁️ مش متزامن', 'err');
    save('_syncErr_', (e && e.message) || String(e));
    if(!quiet) toast('المزامنة فشلت: ' + ((e && e.message) || ''));
  }finally{
    clearTimeout(guard);
    syncBusy = false;
    if(syncAgain){ syncAgain = false; setTimeout(()=> syncNow(true), 300); }
  }
}
/* لو جهاز فيه الشغل الصح والباقي فاضي (أو العكس)، ده بيحسمها بضغطة:
   بنختم كل مفتاح فيه بيانات بالوقت الحالي، فيكسب أي مقارنة ويترفع كله. */
async function syncPushAll(){
  const keys = SYNC_KEYS.filter(syncHasData);
  if(!keys.length){ toast('مفيش بيانات على الجهاز ده ترفعها'); return; }
  if(!confirm('هيترفع كل اللي على الجهاز ده (' + keys.length + ' نوع بيانات) '
    + 'ويتحط مكان اللي على السيرفر.\nاستعمله لو الجهاز ده هو اللي عليه الشغل الصح. متأكد؟')) return;
  const now = Date.now();
  keys.forEach((k, i)=>{ syncRevs[k] = now + i; });
  save('_syncRevs_', syncRevs);
  closeSheet();
  await syncNow(false);
}

/* اختبار اتصال خطوة بخطوة — بيقول بالظبط فين الوقفة بدل «بيزامن...» على طول */
async function testSyncConn(){
  const box = $('#connMsg'); const c = syncCfg();
  if(!c.url){ box.innerHTML = '<b style="color:var(--danger)">المزامنة مقفولة.</b>'; return; }
  const lines = []; const show = ()=> box.textContent = lines.join('\n');
  const step = async (name, fn)=>{
    lines.push('⏳ ' + name + '...'); show();
    const t = Date.now();
    try{ const r = await fn(); lines[lines.length-1] = '✅ ' + name + ' — ' + ((Date.now()-t)/1000).toFixed(1) + 'ث' + (r? ' · ' + r : ''); show(); return true; }
    catch(e){ lines[lines.length-1] = '❌ ' + name + ' — ' + ((e && e.message) || e); show(); return false; }
  };
  const tk = '__conntest__' + Date.now();
  if(!await step('قراءة من السيرفر (GET)', async ()=>{
      const r = await syncApi({action:'list', prefix:SYNC_PREFIX}, true);
      const ks = (r && r.keys) || []; return 'عدد مفاتيح النسخة الجديدة: ' + ks.length; })) return;
  if(!await step('كتابة على السيرفر (POST)', async ()=>{
      const r = await syncApi({action:'set', key:tk, value:'1'});
      if(!r || r.ok !== true) throw new Error((r && r.error) || 'رد غير متوقع'); return 'اتكتب'; })) return;
  await step('قراءة اللي اتكتب', async ()=>{
      const r = await syncApi({action:'get', key:tk}, true);
      if(!r || r.value !== '1') throw new Error((r && r.error) || 'القيمة رجعت غلط'); return 'رجعت صح'; });
  await step('تنضيف', async ()=>{ await syncApi({action:'delete', key:tk}); return 'اتمسح'; });
  const pend = SYNC_KEYS.filter(k=> (syncRevs[k]||0) > (syncPulled[k]||0));
  lines.push('', 'مستني يترفع من الجهاز ده: ' + pend.length + (pend.length? ' (' + pend.join('، ') + ')' : ''));
  show();
}
function doCleanStorage(){

  const nb = pruneBackups(2);
  const freed = before - lsTotal();
  toast(freed ? ('اتفضى ' + fmtKB(freed)) : 'المساحة نضيفة خلاص');
  closeSheet(); setTimeout(openSyncSheet, 300);
}
async function wipeOldServerData(){
  const box = $('#wipeMsg'); if(!syncCfg().url){ toast('اظبط الرابط الأول'); return; }
  box.innerHTML = 'بيقرا مفاتيح السيرفر...';
  try{
    const r = await syncApi({action:'list', prefix:''}, true);
    const all = (r && (r.keys || r.value)) || [];
    const keys = (Array.isArray(all) ? all : JSON.parse(all || '[]'))
      .filter(k=> String(k).indexOf(SYNC_PREFIX) !== 0);
    if(!keys.length){ box.innerHTML = '<b style="color:var(--ok)">السيرفر نضيف — مفيش بيانات قديمة.</b>'; return; }
    if(!confirm('هيتمسح ' + keys.length + ' مفتاح من بيانات التطبيق القديم نهائيًا:\n'
      + keys.slice(0,12).join('، ') + (keys.length>12?' …':'') + '\n\nمتأكد؟')) { box.innerHTML=''; return; }
    let n = 0;
    for(const k of keys){
      box.innerHTML = `بيمسح ${n+1} من ${keys.length}...`;
      try{ await syncApi({action:'delete', key:k}); n++; }catch(e){}
    }
    box.innerHTML = `<b style="color:var(--ok)">اتمسح ${n} من ${keys.length}.</b>`;
  }catch(e){ box.innerHTML = '<b style="color:var(--danger)">فشل: ' + esc(e.message || '') + '</b>'; }
}

function normUnit(u){ return String(u||'').trim().replace(/ه$/,'ة'); }
function pieceBreakdown(name, s){
  const it = itemsByName[name] || {};
  const unit = normUnit(it.unit) || '—';
  const rq = Number(it.rollQty)||0;
  const bigLbl = unit==='لفة'?'لفة':(unit==='كرتونة'?'كرتونة':'وحدة كبيرة');
  const smallLbl = unit==='لفة'?'عود':'قطعة';
  let big = Number(s.big)||0, small = Number(s.small)||0;
  if(!big && !small && rq>1){ const b=Number(s.balance)||0; big=Math.floor(b/rq); small=b%rq; }
  return {unit, bigLbl, smallLbl, big, small};
}
function balText(name, s){
  s = s || {balance:0};
  const b = pieceBreakdown(name, s);
  const bal = Number(s.balance)||0;
  const parts=[]; if(b.big) parts.push(b.big+' '+b.bigLbl); if(b.small) parts.push(b.small+' '+b.smallLbl);
  if(parts.length) return bal+' ('+parts.join(' + ')+')';
  return bal+' '+(b.unit==='—'?'':b.unit);
}

function importStock(file, whId){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sn = wb.SheetNames.find(n=>n.includes('ارصدة')||n.includes('رصيد')) || wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      const hdr = rows[0].map(h=>String(h||'').trim());
      const ni = hdr.findIndex(h=>h.includes('صنف'));
      const bi = hdr.findIndex(h=>h.includes('رصيد')||h.includes('كمية'));
      const wi = hdr.findIndex(h=>h==='مخزن'||h.includes('فرع'));
      const bigI = hdr.findIndex(h=>h.includes('لفه')||h.includes('لفة')||h.includes('كرتونه'));
      const smallI = hdr.findIndex(h=>h.includes('عود')||h.includes('قطعه')||h.includes('قطعة'));
      if(ni<0 || bi<0){ toast('لم يتم التعرف على أعمدة الصنف/الرصيد — تأكد من العناوين'); return; }
      const perWh={};
      for(let i=1;i<rows.length;i++){ const row=rows[i]; if(!row[ni]) continue;
        const targetWh = wi>=0 ? String(row[wi]||'').trim() : null;
        // لو الشيت فيه عمود مخزن، وزّع كل مخزن مذكور على المخزن المطابق بالاسم؛ غير كده كله للمخزن المفتوح حاليًا
        let destId = whId;
        if(targetWh){ const match = warehouses.find(w=>w.name===targetWh); if(match) destId=match.id; else continue; }
        perWh[destId]=perWh[destId]||{};
        perWh[destId][String(row[ni]).trim()] = {balance:row[bi]||0, big:bigI>=0?(row[bigI]||0):0, small:smallI>=0?(row[smallI]||0):0};
      }
      const totalRows = Object.values(perWh).reduce((a,m2)=>a+Object.keys(m2).length,0);
      pendingImport={type:'stock', perWh};
      const whNames = Object.keys(perWh).map(id=>(warehouses.find(w=>w.id===id)||{}).name).join('، ');
      openSheet(`<h3>تأكيد استيراد الأرصدة</h3><p style="font-size:13.5px;color:var(--muted)">
        ${totalRows} صنف${whNames?' — للمخازن: '+esc(whNames):''} — هيتم استبدال بيانات الأرصدة الحالية لهذا المخزن/المخازن.</p>
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button>
        <button class="btn-save" onclick="commitImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في الملف'); }
  };
  r.readAsArrayBuffer(file);
}
/* الطلب خانتين لكل صنف، والوحدتين بتتحددوا من مجموعة الصنف:
     القطاعات (كرافت لاين · نيو لاين · PVC كومبن) → لفة / عود
     الاكسسوارات وأي حاجة تانية              → كرتونة / قطعة
   فمفيش قايمة وحدات تختار منها كل مرة.
   بنقرا السجلات القديمة بكل أشكالها: {order, unit} و {cartons, pieces}. */
const SHORT_UNITS_ROLL = ['لفة','عود'];      // القطاعات
const SHORT_UNITS_BOX  = ['كرتونة','قطعة'];  // الاكسسوارات وغيرها
function isProfileGroup(g){
  g = String(g || '');
  return /قطاعات|نيو لاين/.test(g);
}
function shortUnits(name){
  const it = itemsByName[name] || {};
  return isProfileGroup(it.mainGroup) ? SHORT_UNITS_ROLL : SHORT_UNITS_BOX;
}
// بيرجّع {q1,q2,u1,u2,note} مهما كان شكل السجل المتخزّن
function shortRec(whId, name){
  const r = (whShortage[whId] || {})[name] || {};
  const [u1, u2] = shortUnits(name);
  const base = {q1:'', q2:'', u1, u2, note: r.note || ''};
  if(r.q1 !== undefined || r.q2 !== undefined){
    return Object.assign(base, {q1: r.q1 || '', q2: r.q2 || ''});
  }
  if(r.cartons !== undefined || r.pieces !== undefined){   // شكل v2.8
    return Object.assign(base, {q1: r.cartons || '', q2: r.pieces || ''});
  }
  const legacy = r.order || '';                            // شكل v2.7 وأقدم
  if(!legacy) return base;
  const u = normUnit(r.unit || '');
  return Object.assign(base, u === u1 ? {q1: legacy} : {q2: legacy});
}
function setShortQty(whId, name, field, val){
  val = String(val || '').trim();
  const r = shortRec(whId, name);
  r[field] = val;
  whShortage[whId] = whShortage[whId] || {};
  if(!r.q1 && !r.q2) delete whShortage[whId][name];
  else whShortage[whId][name] = {q1:r.q1, q2:r.q2, u1:r.u1, u2:r.u2, note:r.note};
  save('whShortage_v1', whShortage);
  const el = $('#shTot');
  if(el) el.innerHTML = shortTotalsHtml(shortTotals(whId));
}
// إجماليات الطلب: عدد الأصناف + مجموع كل وحدة لوحدها
function shortTotals(whId){
  const out = {items:0, byUnit:{}};
  Object.keys(whShortage[whId] || {}).forEach(n=>{
    const r = shortRec(whId, n);
    const a = Number(r.q1) || 0, b = Number(r.q2) || 0;
    if(!a && !b) return;
    out.items++;
    if(a) out.byUnit[r.u1] = (out.byUnit[r.u1] || 0) + a;
    if(b) out.byUnit[r.u2] = (out.byUnit[r.u2] || 0) + b;
  });
  return out;
}
// ترتيب ثابت للأعمدة عشان التصدير ما يلخبطش من مرة للتانية
const SHORT_UNIT_ORDER = ['لفة','عود','كرتونة','قطعة'];
function shortUnitCols(whId){
  const seen = Object.keys(shortTotals(whId).byUnit);
  return SHORT_UNIT_ORDER.filter(u=> seen.includes(u))
    .concat(seen.filter(u=> !SHORT_UNIT_ORDER.includes(u)).sort());
}
function shortTotalsHtml(t){
  const u = Object.keys(t.byUnit).sort((a,b)=>{
    const ia = SHORT_UNIT_ORDER.indexOf(a), ib = SHORT_UNIT_ORDER.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  }).map(k=> `<span style="white-space:nowrap">${esc(k)}: <b style="color:var(--blue)">${fmtN(t.byUnit[k])}</b></span>`).join(' · ');
  return `<span style="white-space:nowrap">أصناف: <b>${t.items}</b></span>` + (u ? ' · ' + u : '');
}
function resetShortage(whId){
  const t = shortTotals(whId);
  if(!t.items) return toast('الطلب فاضي خلاص');
  if(!confirm('هيتمسح طلب النواقص كله (' + t.items + ' صنف) وتبدأ من الأول.\n\nمتأكد؟')) return;
  delete whShortage[whId];
  save('whShortage_v1', whShortage);
  toast('اتصفّر — ابدأ من جديد');
  render(true);
}

  m.innerHTML = `

      <input type="date" value="${orderDate}" onchange="setOrderDate('${whId}', this.value)" style="border:1px solid var(--border);border-radius:6px;padding:2px 6px;background:var(--panel);color:var(--text)">

function buildGroupBreakdown(list, whId){
  const buckets={};
  const add=(o,u,v)=>{ if(v) o[u]=(o[u]||0)+v; };
  list.forEach(([name])=>{
    const r=shortRec(whId, name);
    const a=Number(r.q1)||0, b=Number(r.q2)||0;
    if(!a && !b) return;
    const it=itemsByName[name]||{};
    const bucket=exportBucket(it.mainGroup);
    const sub=it.subGroup||'بدون';
    buckets[bucket]=buckets[bucket]||{byUnit:{}, subs:{}};
    add(buckets[bucket].byUnit, r.u1, a); add(buckets[bucket].byUnit, r.u2, b);
    const sb=buckets[bucket].subs[sub]=buckets[bucket].subs[sub]||{};
    add(sb, r.u1, a); add(sb, r.u2, b);
  });
  return buckets;
}

function buildCompareTree(){
  const tree=[];
  [...new Set(items.map(i=>i.mainGroup).filter(Boolean))].forEach(mg=>{
    if(cmpMain.size && !cmpMain.has(mg)) return;
    const mgItems=items.filter(i=>i.mainGroup===mg);
    const subs=[];
    [...new Set(mgItems.map(i=>i.subGroup||'بدون فرعية'))].forEach(sg=>{
      if(cmpSub.size && !cmpSub.has(sg)) return;
      const rows=[];
      mgItems.filter(i=>(i.subGroup||'بدون فرعية')===sg).forEach(it=>{
        const cells=warehouses.map(w=>qtyOf(w.id,it.name));
        if(!cells.reduce((a,b)=>a+b,0) && !cmpZero) return;
        rows.push({name:it.name,cells});
      });
      if(rows.length) subs.push({sg, cells:warehouses.map((w,i)=>rows.reduce((s,r)=>s+r.cells[i],0)), items:rows});
    });
    if(subs.length) tree.push({mg, cells:warehouses.map((w,i)=>subs.reduce((s,x)=>s+x.cells[i],0)), subs});
  });
  return tree;
}
function qCells(cells){
  const tot=cells.reduce((a,b)=>a+b,0);
  return warehouses.map((w,i)=>`<span><small>${esc(w.name)}</small> <b>${fmtN(cells[i])}</b></span>`).join('')+(warehouses.length>1?`<span><small>الكل</small> <b>${fmtN(tot)}</b></span>`:'');
}

function buildColorTable(){
  const norm=s=>String(s).trim();
  const src=items.filter(i=>i.baseName && norm(i.baseName) && i.color && norm(i.color) && (!colMain.size || colMain.has(i.mainGroup)));
  const groups={};
  src.forEach(it=>{
    const mg=it.mainGroup, bn=norm(it.baseName), c=norm(it.color);
    groups[mg]=groups[mg]||{}; groups[mg][bn]=groups[mg][bn]||{};
    const cells=groups[mg][bn][c]=groups[mg][bn][c]||warehouses.map(()=>0);
    warehouses.forEach((w,i)=>{ cells[i]+=qtyOf(w.id,it.name); });
  });
  const colorSum={};
  Object.values(groups).forEach(bs=>Object.values(bs).forEach(cs=>Object.entries(cs).forEach(([c,cells])=>{ colorSum[c]=(colorSum[c]||0)+cells.reduce((a,b)=>a+b,0); })));
  let colors=Object.keys(colorSum); if(!colZero) colors=colors.filter(c=>colorSum[c]>0);
  const pri=['ابيض','بيج']; colors.sort((a,b)=>{ const pa=pri.indexOf(a), pb=pri.indexOf(b); if(pa>=0||pb>=0) return (pa<0?99:pa)-(pb<0?99:pb); return colorSum[b]-colorSum[a]; });
  const W=warehouses.length, rows=[];
  Object.entries(groups).forEach(([mg,bs])=>{
    const list=[];
    Object.entries(bs).forEach(([bn,cs])=>{
      const flat=[]; colors.forEach(c=>{ const cells=cs[c]||warehouses.map(()=>0); flat.push(...cells); });
      const total=flat.reduce((a,b)=>a+b,0);
      if(total||colZero) list.push({type:'item',label:bn,flat,total});
    });
    if(list.length){ rows.push({type:'main',label:mg}); rows.push(...list); }
  });
  return {colors, rows, W};
}

function importSales(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sn = wb.SheetNames.find(n=>n==='Header_Wide') || wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      let hdrRow=1; while(hdrRow<rows.length && !rows[hdrRow].includes('c_name')) hdrRow++;
      const hdr = rows[hdrRow];
      const idx=n=>hdr.indexOf(n);
      const ci=idx('c_name'), ii=idx('Item_Name'), voi=idx('vout'), vii=idx('vin');
      const dataRows = rows.slice(hdrRow+1).filter(r=>r[ci]);
      const custMap={}, sectorMap={};
      const unmatchedCust=new Set(), unmatchedItems=new Set();
      const custByName={}; customers.forEach(c=>custByName[c.name]=c);
      for(const row of dataRows){
        const cname=String(row[ci]).trim(); if(!cname) continue;
        const vout=parseFloat(row[voi])||0, vin=parseFloat(row[vii])||0, net=vout-vin;
        custMap[cname]=(custMap[cname]||0)+net;
        if(!custByName[cname]) unmatchedCust.add(cname);
        const iname=String(row[ii]||'').trim();
        const it=itemsByName[iname];
        const sector = it? (SECTOR_MAP[it.mainGroup]||'أخرى') : 'غير معروف';
        if(!it && iname) unmatchedItems.add(iname);
        sectorMap[cname]=sectorMap[cname]||{}; sectorMap[cname][sector]=(sectorMap[cname][sector]||0)+net;
      }
      const total=Object.values(custMap).reduce((a,b)=>a+b,0);

async function docToCanvas(el){
  await loadLib('html2canvas',()=>window.html2canvas);
  // نقلل الدقة تلقائيًا للجداول الطويلة عشان متعدّيش حد الذاكرة في الموبايل
  const area=Math.max(1,el.offsetWidth*el.offsetHeight); let sc=2;
  while(area*sc*sc>12e6 && sc>0.7) sc=Math.round((sc-0.1)*10)/10;
  return window.html2canvas(el,{scale:sc,backgroundColor:'#fff',useCORS:true});

async function exportDocPdf(bodyHtml, filename, landscape){
  toast('جاري تجهيز ملف PDF...'); const el=mkDoc(bodyHtml,landscape);
  try{
    await loadLib('jspdf',()=>window.jspdf);
    const canvas=await docToCanvas(el);
    const pdf=new window.jspdf.jsPDF({orientation:landscape?'l':'p',unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), mg=18;
    const sc=(pw-2*mg)/canvas.width, pageH=(ph-2*mg)/sc;
    const er=el.getBoundingClientRect(), k=canvas.width/er.width;
    const bounds=[...el.querySelectorAll('tr')].map(r=>Math.round((r.getBoundingClientRect().bottom-er.top)*k));
    let y=0, first=true;
    while(y<canvas.height-2){
      let end=Math.min(y+pageH,canvas.height);
      if(end<canvas.height){ const cand=bounds.filter(b=>b>y+pageH*0.4 && b<=end); if(cand.length) end=cand[cand.length-1]; }
      const h=end-y, sl=document.createElement('canvas'); sl.width=canvas.width; sl.height=h;
      sl.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(!first) pdf.addPage(); first=false;
      pdf.addImage(sl.toDataURL('image/jpeg',0.92),'JPEG',mg,mg,canvas.width*sc,h*sc);
      y=end;
    }
    pdf.save(filename+'.pdf'); toast('تم تنزيل ملف PDF');
  }catch(e){ console.error(e); toast('تعذر إنشاء PDF — تأكد من الاتصال بالإنترنت'); }
  finally{ el.remove(); }
}

    rows+=`<tr class="m"><td colspan="2">${esc(bucket)}</td>${cols.map(u=>`<td>${b.byUnit[u]||''}</td>`).join('')}</tr>`;
    Object.entries(b.subs).forEach(([sub,t])=>{
      rows+=`<tr class="z"><td></td><td>${esc(sub)}</td>${cols.map(u=>`<td>${t[u]||''}</td>`).join('')}</tr>`; });
  });

function hexRgb(h){ h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function mixWhite(h,r){ return '#'+hexRgb(h).map(c=>Math.round(c+(255-c)*r).toString(16).padStart(2,'0')).join(''); }

}

function setInvCount(whId,itemId,kind,val){
  const it=items.find(x=>x.id===itemId); if(!it) return;
  const inv=invGet(whId), rq=Number(it.rollQty)||0, c=inv.counts[it.name]||{};

  else {

    else { c.actual=(c.big||0)*rq+(c.small||0); inv.counts[it.name]=c; }

  Object.entries(inv.counts).forEach(([name,c])=>{
    const it=itemsByName[name]||{}, prog=Number(stock[name]?.balance)||0, act=Number(c.actual)||0;
    rows.push({name, mg:it.mainGroup||'غير مصنف', prog, act, diff:act-prog});
  });
  const def=rows.filter(r=>r.diff<0), exc=rows.filter(r=>r.diff>0);
  const defTotal=def.reduce((a,r)=>a-r.diff,0), excTotal=exc.reduce((a,r)=>a+r.diff,0);

/* ═══════════════ الربط مع برنامج الطلبات (الموزعين) ═══════════════
   اتجاهين:
     ⬆️ بنبعت رصيد طنطا هناك فيحل محل الرصيد اللي عندهم.
     ⬇️ بنجيب الطلبات اللي الموزعين عملوها عشان تشوفها هنا وتخصمها من الرصيد.
   كل اتجاه له رقم سري مختلف عندهم: الرفع برقم «الإدارة» (manageLogin)،
   وقراءة الطلبات برقم «الأدمن» (adminLogin). التوكن بينتهي بعد ١٢ ساعة
   فبنسجّل دخول لحظي قبل كل عملية بدل ما نخزّن توكن بايظ.
   الأرقام السرية بتتخزّن على الجهاز بس — عمدًا مش بتتزامن. */
const ORD_URL = 'https://script.google.com/macros/s/AKfycbwRMd_ZIrXC_UQL1zc_YM8gV3zCfB9nWx8kehDN6QzYBW1OnrhDLdoWx42WWiNWVnEX/exec';
const ORD_STORE = 'طنطا';                 // برنامج الموزعين بيشتغل على رصيد طنطا
function ordWh(){ return warehouses.find(w=> String(w.name||'').trim() === ORD_STORE) || null; }
function ordPin(kind){ try{ return localStorage.getItem('_ordPin_' + kind) || ''; }catch(e){ return ''; } }
function ordSetPin(kind, v){ try{ v ? localStorage.setItem('_ordPin_'+kind, v) : localStorage.removeItem('_ordPin_'+kind); }catch(e){} }

// بصمة الاسم: من غير مسافات ولا رموز ولا تشكيل — عشان «باب 80 سم» = «باب ٨٠سم»
function ordNorm(n){
  return String(n||'').trim().toLowerCase()
    .replace(/[٠-٩]/g, d=> '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[\s\-_.،,/\\()]+/g,'');
}
function ordTheirName(our){
  const k = ordNorm(our);
  return Object.prototype.hasOwnProperty.call(ordMap, k) ? ordMap[k] : undefined;
}
async function ordApi(path){
  const r = await fetch(ORD_URL + path);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function ordLogin(kind, pin){
  const act = kind === 'admin' ? 'adminLogin' : 'manageLogin';
  const d = await ordApi('?action=' + act + '&pin=' + encodeURIComponent(pin));
  if(d && d.ok && d.token) return d.token;
  const why = d && d.reason;
  throw new Error(
    why === 'wrong_pin' ? 'الرقم السري غلط.'
    : why === 'locked' ? 'برنامج الطلبات قفل المحاولات مؤقتًا بعد محاولات غلط كتير — استنى شوية.'
    : why === 'not_configured' ? 'برنامج الطلبات لسه ما اتظبطش عليه رقم سري.'
    : 'الدخول لبرنامج الطلبات مانجحش.');
}
// أصناف برنامج الطلبات (نداء عام من غير رقم سري)
let ordCat = null;
async function ordFetchCatalog(){
  const d = await ordApi('?action=catalog');
  ordCat = ((d && d.items) || []).map(x=> String(x.name||'').trim()).filter(Boolean);
  return ordCat;
}
// حالة المطابقة بين أسمائنا وأسماءهم
function ordMatch(){
  const wh = ordWh(); if(!wh) return {ok:[],auto:[],none:[],skip:[]};
  const names = Object.keys(whStock[wh.id] || {});
  const exact = new Set(ordCat || []), fp = new Map();
  (ordCat || []).forEach(n=>{ const f = ordNorm(n); if(f && !fp.has(f)) fp.set(f, n); });
  const out = {ok:[], auto:[], none:[], skip:[]};
  names.forEach(our=>{
    const saved = ordTheirName(our);
    if(saved === '') return out.skip.push(our);
    if(saved) return exact.has(saved) ? out.ok.push(our) : out.none.push(our);
    if(exact.has(our)) return out.ok.push(our);
    const g = fp.get(ordNorm(our));
    if(g) return out.auto.push({our, their:g});
    out.none.push(our);
  });
  return out;
}
// الصفوف اللي هتتبعت — باسمهم، ومن غير المتجاهَل
function ordRows(){
  const wh = ordWh(); if(!wh) return [];
  const st = whStock[wh.id] || {};
  const rows = [];
  Object.keys(st).forEach(n=>{
    const t = ordTheirName(n);
    if(t === '') return;
    rows.push({name: t || n, stock: Number(st[n] && st[n].balance) || 0});
  });
  return rows;
}

let ordOrders = null;        // آخر طلبات اتجابت
function ordMsg(html){ const el = $('#ordMsg'); if(el) el.innerHTML = html; }

async function ordSendStock(){
  const pin = ($('#ord_mpin') && $('#ord_mpin').value || '').trim();
  const rows = ordRows();
  if(!rows.length) return ordMsg('<b style="color:var(--danger)">مفيش رصيد مرفوع لطنطا.</b>');
  if(!pin) return ordMsg('<b style="color:var(--danger)">اكتب رقم «شاشة الإدارة» بتاع برنامج الطلبات.</b>');
  if(!confirm('هيتبعت رصيد ' + rows.length + ' صنف من «طنطا» لبرنامج الطلبات ويحل محل الرصيد الحالي هناك. تكمل؟')) return;
  ordSetPin('manage', pin);
  ordMsg('بيسجّل دخول...');
  try{
    const tk = await ordLogin('manage', pin);
    ordMsg('بيبعت الرصيد...');
    const r = await fetch(ORD_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'manageUploadCatalog', token:tk, mode:'stock', rows})});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if(!d || d.ok === false) throw new Error((d && d.error) || 'برنامج الطلبات رفض الطلب.');
    const nf = d.notFound || [];
    ordMsg('<b style="color:var(--ok)">تم: ' + (d.updated || 0) + ' صنف اتحدّث رصيده هناك.</b>'
      + (nf.length ? '<div style="margin-top:6px;color:#b45309"><b>' + nf.length + ' صنف</b> مش موجودين عندهم بنفس الاسم فاتسابوا زي ما هم:<br>'
          + esc(nf.slice(0,10).join('، ')) + (nf.length>10?' …':'')
          + '<br>دوس «🔍 طابق الأسماء» تحت عشان تربطهم مرة واحدة.</div>' : ''));
  }catch(e){ ordMsg('<b style="color:var(--danger)">' + esc(ordErr(e)) + '</b>'); }
}

async function ordGetOrders(){
  const pin = ($('#ord_apin') && $('#ord_apin').value || '').trim();
  if(!pin) return ordMsg('<b style="color:var(--danger)">اكتب رقم «الأدمن» بتاع برنامج الطلبات.</b>');
  ordSetPin('admin', pin);
  ordMsg('بيسجّل دخول...');
  try{
    const tk = await ordLogin('admin', pin);
    ordMsg('بيجيب الطلبات...');
    const d = await ordApi('?action=lookup&token=' + encodeURIComponent(tk));
    ordOrders = Array.isArray(d) ? d : [];
    ordMsg('');
    render(true);
  }catch(e){ ordMsg('<b style="color:var(--danger)">' + esc(ordErr(e)) + '</b>'); }
}
function ordErr(e){
  const m = (e && e.message) || '';
  return /^HTTP|Failed to fetch|NetworkError|Load failed/.test(m)
    ? 'مفيش اتصال ببرنامج الطلبات دلوقتي — جرّب تاني.' : m;
}
// مجموع الكميات المطلوبة لكل صنف (باسمنا إحنا)
function ordDemand(onlyOpen){
  const theirToOurs = {};
  Object.keys(ordMap).forEach(k=>{ if(ordMap[k]) theirToOurs[ordMap[k]] = k; });
  const wh = ordWh(); const st = (wh && whStock[wh.id]) || {};
  const byNorm = {}; Object.keys(st).forEach(n=> byNorm[ordNorm(n)] = n);
  const out = {};
  (ordOrders || []).forEach(o=>{
    if(onlyOpen && /تم تنفيذ/.test(o.status || '')) return;
    (o.items || []).forEach(it=>{
      const their = String(it.name || it.product || '').trim();
      if(!their) return;
      const ourKey = theirToOurs[their] || ordNorm(their);
      const our = byNorm[ourKey] || their;
      out[our] = (out[our] || 0) + (Number(it.qty || it.quantity) || 0);
    });
  });
  return out;
}
function ordDeductStock(){
  const wh = ordWh(); if(!wh) return;
  const dem = ordDemand(true);
  const names = Object.keys(dem).filter(n=> dem[n] > 0);
  if(!names.length) return toast('مفيش طلبات مفتوحة تتخصم');
  if(!confirm('هيتخصم من رصيد طنطا هنا:\n' + names.slice(0,10).map(n=> '• ' + n + ' ← ' + dem[n]).join('\n')
    + (names.length>10 ? '\n…و' + (names.length-10) + ' غيرهم' : '')
    + '\n\nده بيغيّر الرصيد عندك في التطبيق ده بس. تكمل؟')) return;
  whStock[wh.id] = whStock[wh.id] || {};
  names.forEach(n=>{
    const cur = whStock[wh.id][n] || {balance:0};
    cur.balance = (Number(cur.balance)||0) - dem[n];
    whStock[wh.id][n] = cur;
  });
  save('whStock_v1', whStock);
  toast('اتخصم ' + names.length + ' صنف من رصيد طنطا');
  render(true);
}
async function ordAutoMatch(){
  ordMsg('بيجيب أصناف برنامج الطلبات...');
  try{
    if(!ordCat) await ordFetchCatalog();
    const m = ordMatch();
    m.auto.forEach(x=>{ ordMap[ordNorm(x.our)] = x.their; });
    save('ordMap_v1', ordMap);
    ordMsg('<b style="color:var(--ok)">اتربط ' + m.auto.length + ' صنف تلقائي.</b>');
    render(true);
  }catch(e){ ordMsg('<b style="color:var(--danger)">' + esc(ordErr(e)) + '</b>'); }
}
function ordSetName(our, their){
  const k = ordNorm(our);
  if(their) ordMap[k] = their; else delete ordMap[k];
  save('ordMap_v1', ordMap); render(true);
}
function ordSkip(our){
  const k = ordNorm(our);
  if(ordMap[k] === '') delete ordMap[k]; else ordMap[k] = '';
  save('ordMap_v1', ordMap); render(true);
}

  <div class="panelbox">

/* ===== تنسيق الإكسل =====
   الشيت بيطلع زي التقرير: رأس ملوّن، برواز، صفوف مخططة، صف إجمالي مميّز،
   وفلتر جاهز على العناوين. sign[] بتحدد أعمدة الخصم (أحمر) والزيادة (أخضر). */
const XS_NAVY = '16307A', XS_LINE = 'C4CBE0', XS_BAND = 'EEF1F9', XS_TOT = 'D9E1F5';
const xsBorder = (c)=> ({style:'thin', color:{rgb: c || XS_LINE}});
const xsAll = (c)=> ({top:xsBorder(c), bottom:xsBorder(c), left:xsBorder(c), right:xsBorder(c)});
const XS_RED = 'C0202F', XS_GREEN = '0A7D3C';
function styleSheet(ws, o){
  o = o || {};
  const sign = o.sign || [];             // '' | 'minus' | 'plus' لكل عمود
  const headRow = o.headRow || 0;        // صف العناوين (0-based داخل الشيت)
  const titleRows = o.titleRows || 0;    // عدد سطور رأس التقرير فوقه
  const totalRe = /^(الإجمالي|الاجمالي|إجمالي|اجمالي|صافي|مجمل)/;
  if(!ws['!ref']) return ws;
  const R = XLSX.utils.decode_range(ws['!ref']);
  const at = (r, c)=> ws[XLSX.utils.encode_cell({r, c})];
  for(let r = R.s.r; r <= R.e.r; r++){
    // اسم الصف (أول خانة فيها كلام) عشان نعرف الإجماليات
    let label = '';
    for(let c = R.s.c; c <= R.e.c && !label; c++){
      const v = at(r, c); if(v && v.t === 's') label = String(v.v || '').trim();
    }
    const isTitle = r < titleRows;
    const isHead  = r === headRow;
    const isTot   = !isTitle && !isHead && totalRe.test(label);
    for(let c = R.s.c; c <= R.e.c; c++){
      const k = XLSX.utils.encode_cell({r, c});
      if(!ws[k]) ws[k] = {t:'s', v:''};
      const cell = ws[k];
      if(isTitle){
        cell.s = {font:{bold: r === 0, sz: r === 0 ? 15 : 11, color:{rgb: r === 0 ? '16307A' : '555555'}},
                  alignment:{horizontal:'center', vertical:'center'}};
      } else if(isHead){
        cell.s = {font:{bold:true, sz:11, color:{rgb:'FFFFFF'}},
                  fill:{fgColor:{rgb: XS_NAVY}},
                  alignment:{horizontal:'center', vertical:'center', wrapText:true},
                  border: xsAll('0E205C')};
      } else {
        const numeric = cell.t === 'n';
        // الخصم أحمر والإضافة خضرا — زي الشاشة والـPDF.
        // 'auto' = اللون من إشارة الرقم نفسه (عمود «الفرق» في الجرد)
        // أو من نص الخانة (عمود «النوع»: عجز/زيادة).
        let sg = sign[c - R.s.c];
        if(sg === 'auto'){
          if(numeric) sg = cell.v < 0 ? 'minus' : (cell.v > 0 ? 'plus' : '');
          else sg = /عجز/.test(String(cell.v || '')) ? 'minus'
                  : (/زياد/.test(String(cell.v || '')) ? 'plus' : '');
        }
        // صف الإجمالي في الإكسل خلفيته فاتحة (D9E1F5) فالأحمر والأخضر
        // الغامقين بيتقروا عليه عادي
        const paint = sg && (numeric ? cell.v !== 0 : !!String(cell.v || ''));
        cell.s = {font:{bold: isTot || !!paint, sz:10.5,
                        color: paint ? {rgb: sg === 'minus' ? XS_RED : XS_GREEN} : undefined},
                  fill:{fgColor:{rgb: isTot ? XS_TOT : ((r - headRow) % 2 === 0 ? XS_BAND : 'FFFFFF')}},
                  alignment:{horizontal: numeric ? 'center' : 'right', vertical:'center'},
                  border: xsAll()};
      }
    }
  }
  // فلتر على صف العناوين — بيخلّي الشيت جدول تقدر ترتّبه وتفلتره.
  // (تثبيت الصف مش مدعوم في المكتبة دي، فمش بنكتبه.)
  ws['!autofilter'] = {ref: XLSX.utils.encode_range(
    {s:{r:headRow, c:R.s.c}, e:{r:R.e.r, c:R.e.c}})};
  const rows = [];
  for(let r = R.s.r; r <= R.e.r; r++) rows.push({hpt: r < titleRows ? (r === 0 ? 24 : 17) : (r === headRow ? 30 : 17)});
  ws['!rows'] = rows;
  return ws;
}
/* رأس التقرير جوه الإكسل: سطر اسم الشركة وسطر عنوان التقرير والتاريخ،
   وبعدين العناوين. نفس شكل الـPDF. */
function saveAoaXlsx(aoa, sheetName, fileName, widths, opt){
  opt = opt || {};
  const ncol = Math.max(1, ...aoa.map(r=> (r||[]).length));
  const pad = (row)=>{ const r = (row||[]).slice(); while(r.length < ncol) r.push(''); return r; };
  const title = opt.title || sheetName;
  const head = [
    pad(['مجموعة القرشي']),
    pad([title + '  —  ' + new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})]),
  ];
  const full = head.concat(aoa.map(pad));
  const ws = XLSX.utils.aoa_to_sheet(full);
  if(widths) ws['!cols'] = widths.map(w=>({wch:w}));
  // دمج سطري الرأس على عرض الجدول كله
  ws['!merges'] = [{s:{r:0,c:0}, e:{r:0,c:ncol-1}}, {s:{r:1,c:0}, e:{r:1,c:ncol-1}}];
  styleSheet(ws, {titleRows: 2, headRow: 2, sign: opt.sign || []});
  const wbk = XLSX.utils.book_new();
  wbk.Workbook = {Views:[{RTL:true}]};   // الشيت يفتح من اليمين لليسار
  XLSX.utils.book_append_sheet(wbk, ws, sheetName);
  XLSX.writeFile(wbk, fileName);
}

const MONTHS_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const PAY_FIELDS=[['abP','غياب بإذن (أيام)'],['abN','غياب بدون إذن (أيام)'],['late','تأخيرات (ساعات)'],['ot','إضافي (ساعات)'],['pen','جزاءات (أيام)'],['adv','سلف (جنيه)'],['ins','تأمينات (جنيه)'],['bonus','حوافز (جنيه)']];
function payLabel(month,half){
  const p=String(month).split('-'); const mn=MONTHS_AR[(+p[1]||1)-1]+' '+p[0];
  return (half==='m'?'الشهر كامل':(half===2?'النصف الثاني (16 – 30)':'النصف الأول (1 – 15)'))+' — '+mn;
}
function empIn(emp,half){ return half===1? emp.h1!==false : emp.h2!==false; }
function calcPay(emp, half, e){
  e=e||{};
  const both=emp.h1!==false && emp.h2!==false, monthly=nz(emp.salary);
  const due=both? rnd0(monthly/2) : monthly;
  const day=both? rnd2(due/15) : rnd2(monthly/30);
  const hour=rnd2(day/9);
  const dAbP=rnd0(nz(e.abP)*day), dAbN=rnd0(nz(e.abN)*day), dLate=rnd0(nz(e.late)*hour), otAmt=rnd0(nz(e.ot)*hour*1.5), dPen=rnd0(nz(e.pen)*day);
  const adv=nz(e.adv), ins=nz(e.ins), bonus=nz(e.bonus);
  const ded=dAbP+dAbN+dLate+dPen+adv+ins;
  const net=mr5(due-ded+otAmt+bonus);
  return {emp,half,monthly,due,day,hour,abP:nz(e.abP),abN:nz(e.abN),late:nz(e.late),ot:nz(e.ot),pen:nz(e.pen),dAbP,dAbN,dLate,otAmt,dPen,adv,ins,bonus,ded,net,note:e.note||''};
}
function payEntry(month,half,id){ return ((payData[month]||{})['h'+half]||{})[id]||{}; }
function payRows(month, half){
  if(half==='m'){
    const map={};
    [1,2].forEach(h=>employees.forEach(emp=>{
      if(!empIn(emp,h)) return;
      const r=calcPay(emp,h,payEntry(month,h,emp.id)), a=map[emp.id];
      if(!a) map[emp.id]=Object.assign({},r,{half:'m'});
      else ['due','abP','abN','late','ot','pen','dAbP','dAbN','dLate','otAmt','dPen','adv','ins','bonus','ded','net'].forEach(k=>{ a[k]+=r[k]; });
    }));
    return employees.filter(e=>map[e.id]).map(e=>map[e.id]);
  }
  return employees.filter(emp=>empIn(emp,half)).map(emp=>calcPay(emp,half,payEntry(month,half,emp.id)));
}
function payTotals(rows){
  const t={n:rows.length,monthly:0,due:0,dAb:0,dLate:0,otAmt:0,dPen:0,adv:0,ins:0,ded:0,bonus:0,net:0};
  rows.forEach(r=>{ t.monthly+=r.monthly; t.due+=r.due; t.dAb+=r.dAbP+r.dAbN; t.dLate+=r.dLate; t.otAmt+=r.otAmt; t.dPen+=r.dPen; t.adv+=r.adv; t.ins+=r.ins; t.ded+=r.ded; t.bonus+=r.bonus; t.net+=r.net; });
  return t;
}

function importEmployees(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sn=wb.SheetNames.find(n=>n.includes('الموظفين'))||wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      let hi=rows.findIndex(x=>x.some(c=>String(c).includes('اسم الموظف'))); if(hi<0) hi=2;
      const list=[];
      for(let i=hi+1;i<rows.length;i++){ const x=rows[i]; const name=String(x[1]||'').trim(); if(!name||!nz(x[3])) continue;
        list.push({id:uid(),name,branch:String(x[2]||'').trim(),salary:nz(x[3]),h1:String(x[4]).includes('✔'),h2:String(x[5]).includes('✔')}); }
      if(!list.length){ toast('لم يتم إيجاد موظفين في الملف'); return; }
      pendingImport={type:'employees',list};
      openSheet(`<h3>تأكيد الاستيراد</h3><p style="font-size:13.5px;color:var(--muted)">${list.length} موظف — هيتم استبدال قائمة العاملين الحالية.</p>
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button><button class="btn-save" onclick="commitImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في قراءة الملف'); }
  };
  r.readAsArrayBuffer(file);
}

function gvCalc(o){
  const rows=o.rows.map((r,i)=>{
    const g=gvcodes.find(x=>x.id===r.gid)||{}, pc=nz(g.perCarton), w=nz(g.weight), p=nz(g.price), qty=nz(r.qty);
    return {i,gid:r.gid,name:g.name||r.name||'صنف محذوف',code:g.code||r.code||'',pc,w,p,qty,cartons:pc? qty/pc : 0,weight:qty*w,value:qty*p,noPrice:!p};
  });
  const tot={cartons:0,weight:0,value:0}; rows.forEach(r=>{ tot.cartons+=r.cartons; tot.weight+=r.weight; tot.value+=r.value; });
  const cap=nz(o.containers)*nz(o.cap), diff=cap-tot.weight;
  const status=Math.abs(diff)<0.0001? 'مظبوطة تمام' : (diff>0? 'لسه فيها مكان '+fmt1(diff)+' كجم' : 'الحمولة زيادة عن الحاويات بـ '+fmt1(-diff)+' كجم');
  return {rows,tot,cap,diff,status};
}

    return `<div class="card"><div class="info"><div class="name" style="font-size:13px">${esc(g.name)}</div><div class="sub">${esc(g.code)} · ${g.perCarton||'—'} قطعة/كرتونة</div></div>
      <input type="number" inputmode="numeric" placeholder="الكمية" value="${ex?ex.qty||'':''}" style="width:80px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px" onchange="gvSetQtyDirect('${g.id}',this.value)"></div>`;
  }).join('') : `<div class="empty">${gvcodes.length?'لا توجد نتائج':'لسه مفيش أكواد جيفز — استوردها من الأصناف ← أكواد جيفز'}</div>`;
}
function gvSetQtyDirect(gid,val){
  const o=gvGet(); if(!o) return; const qty=Number(val)||0, g=gvcodes.find(x=>x.id===gid); if(!g) return;
  const ex=o.rows.find(r=>r.gid===gid);
  if(!qty){ if(ex) o.rows=o.rows.filter(r=>r.gid!==gid); }
  else if(ex) ex.qty=qty;
  else o.rows.push({gid,name:g.name,code:g.code,qty});
  gvSave(); render();
}
function gvImportExcel(file){
  const o=gvGet(); if(!o){ toast('اعمل طلبية جديدة الأول'); return; }
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      let hit=null;
      for(const sn of wb.SheetNames){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
        for(let hi=0;hi<Math.min(rows.length,6);hi++){
          const hdr=(rows[hi]||[]).map(h=>String(h||'').trim());
          const ni=hdr.findIndex(h=>h.includes('اسم الصنف')), qi=hdr.findIndex(h=>h.includes('الكمية'));
          if(ni>=0 && qi>=0){ hit={rows,hi,ni,qi}; break; }
        }
        if(hit) break;
      }
      if(!hit){ toast('لم يتم التعرف على أعمدة اسم الصنف/الكمية في الملف'); return; }
      const {rows,hi,ni,qi}=hit, newRows=o.rows.map(r2=>({...r2})); let matched=0; const unmatched=[];
      for(let i=hi+1;i<rows.length;i++){
        const row=rows[i], name=String(row[ni]||'').trim(), qty=Number(row[qi])||0;
        if(!name || !qty) continue;
        const g=gvcodes.find(x=>x.name.trim()===name);
        if(!g){ unmatched.push(name); continue; }
        matched++;
        const ex=newRows.find(r2=>r2.gid===g.id);
        if(ex) ex.qty=qty; else newRows.push({gid:g.id,name:g.name,code:g.code,qty});
      }
      if(!matched && !unmatched.length){ toast('لا توجد بيانات في الملف'); return; }
      pendingImport={type:'gvrows',rows:newRows};
      openSheet(`<h3>تأكيد استيراد الطلبية</h3><p style="font-size:13.5px;color:var(--muted)">
        ${matched} صنف هيتضاف/يتحدّث في الطلبية الحالية.
        ${unmatched.length? '<br>⚠️ '+unmatched.length+' صنف مش موجود في أكواد جيفز: '+unmatched.slice(0,6).map(esc).join('، ')+(unmatched.length>6?' ...':''):''}</p>
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button><button class="btn-save" onclick="commitImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في قراءة الملف'); console.error(err); }
  };
  r.readAsArrayBuffer(file);
}
function renderGV(m){
  const shown=gvOrders.filter(o=>gvShowArch||!o.archived||o.id===gvCur), o=gvGet();
  const head=`<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
    <select onchange="gvSelect(this.value)" style="flex:1;min-width:0;padding:9px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13px">
      <option value="">— اختار طلبية —</option>${shown.map(x=>`<option value="${x.id}" ${x.id===gvCur?'selected':''}>${x.archived?'📦 ':''}${esc(x.name)}</option>`).join('')}</select>
    <button class="iconbtn" onclick="gvNew()" title="طلبية جديدة" style="width:auto;padding:0 12px;font-size:13px;font-weight:700;color:var(--blue)">➕ جديدة</button></div>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:10px"><input type="checkbox" ${gvShowArch?'checked':''} onchange="gvShowArch=this.checked;render()"> إظهار الطلبيات المؤرشفة</label>`;
  if(!o){ m.innerHTML=head+`<div class="empty">${gvOrders.length?'اختار طلبية من فوق':'لسه مفيش طلبيات — دوس ➕ جديدة'}</div>`; return; }
  const c=gvCalc(o), pct=c.cap? Math.min(100,c.tot.weight/c.cap*100):0, over=c.diff<-0.0001;
  const inp='width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13.5px';
  const qi='width:70px;padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px;text-align:center';
  m.innerHTML=head+`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
      <div style="grid-column:1/-1"><label style="font-size:11.5px;color:var(--muted)">اسم الطلبية</label><input style="${inp}" value="${esc(o.name)}" onchange="gvField('name',this.value)"></div>
      <div><label style="font-size:11.5px;color:var(--muted)">التاريخ</label><input type="date" style="${inp}" value="${o.date}" onchange="gvField('date',this.value)"></div>
      <div><label style="font-size:11.5px;color:var(--muted)">عدد الحاويات</label><input type="number" inputmode="numeric" style="${inp}" value="${o.containers}" onchange="gvField('containers',this.value)"></div>
      <div style="grid-column:1/-1"><label style="font-size:11.5px;color:var(--muted)">حمولة الحاوية الواحدة (كجم)</label><input type="number" inputmode="numeric" style="${inp}" value="${o.cap}" onchange="gvField('cap',this.value)"></div>
    </div>
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">
        <div><div style="font-size:11.5px;color:var(--muted)">الكراتين</div><div style="font-size:17px;font-weight:700">${fmt1(c.tot.cartons)}</div></div>
        <div><div style="font-size:11.5px;color:var(--muted)">الوزن (كجم)</div><div style="font-size:17px;font-weight:700">${fmt1(c.tot.weight)}</div></div>
        <div><div style="font-size:11.5px;color:var(--muted)">القيمة ($)</div><div style="font-size:17px;font-weight:700">${fmt2(c.tot.value)}</div></div></div>
      <div style="height:8px;background:var(--panel2);border-radius:6px;margin:10px 0 6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${over?'var(--danger)':'var(--ok)'}"></div></div>
      <div style="font-size:12.5px;font-weight:700;color:${over?'var(--danger)':'var(--ok)'}">${esc(c.status)} <span style="color:var(--muted);font-weight:400">(السعة ${fmtN(c.cap)} كجم)</span></div></div>
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <button onclick="gvAddItem()" style="flex:2;padding:10px;border-radius:9px;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:13px">➕ إضافة أصناف</button>
      <label style="flex:1;text-align:center;padding:10px 4px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:700;font-size:12px;cursor:pointer">📥 استيراد إكسل<input type="file" id="impGvOrder" accept=".xlsx,.xls" style="display:none"></label>
      <button onclick="gvArchive()" style="flex:1;padding:10px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:700;font-size:12.5px">${o.archived?'♻️ استرجاع':'📦 أرشفة'}</button>
      <button onclick="gvDelete()" style="padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--danger);font-size:13px">🗑️</button></div>
    ${c.rows.length? c.rows.map(r=>`<div class="card" style="flex-wrap:wrap"><div class="info" style="flex-basis:100%"><div class="name" style="font-size:13px">${r.i+1}. ${esc(r.name)}</div>
        <div class="sub">${esc(r.code)} · ${r.pc||'—'} قطعة/كرتونة · ${fmt2(r.w)} كجم · ${r.p? fmt2(r.p)+' $':'<span style="color:var(--danger)">⚠️ بدون سعر</span>'}</div></div>
      <input type="number" inputmode="numeric" placeholder="قطعة" value="${r.qty||''}" style="${qi}" onchange="gvQty(${r.i},'q',this.value)">
      <input type="number" inputmode="decimal" placeholder="كرتونة" value="${r.qty&&r.pc? Math.round(r.cartons*100)/100 : ''}" style="${qi}" onchange="gvQty(${r.i},'c',this.value)">
      <div class="sub" style="flex:1;min-width:120px">${fmt1(r.weight)} كجم · ${fmt2(r.value)} $${r.pc && r.qty && Math.abs(r.cartons-Math.round(r.cartons))>0.0001?' <span style="color:var(--danger)">⚠️ كرتونة مش كاملة</span>':''}</div>
      <button onclick="gvDelRow(${r.i})" style="border:none;background:none;color:var(--danger);font-size:16px">✕</button></div>`).join('')
      : `<div class="empty">الطلبية فاضية — دوس ➕ إضافة أصناف</div>`}
    ${floatBar(`<button onclick="exportGvExcel()">📊 إكسل</button><button onclick="exportGvPdf()">📄 PDF</button><button onclick="exportGvImage()">🖼️ صورة</button>`)}`;
  const fi=document.getElementById('impGvOrder'); if(fi) fi.onchange=e=>{ if(e.target.files[0]) gvImportExcel(e.target.files[0]); };
}
function gvModel(){
  const o=gvGet(), c=gvCalc(o), body=[];
  c.rows.forEach((r,i)=>body.push({type:'row',cells:[i+1,r.name,r.code,r.qty,r.pc,rnd2(r.cartons),r.w,rnd2(r.weight),r.p,rnd2(r.value)]}));
  body.push({type:'tot',cells:['','الإجمالي','','','',rnd2(c.tot.cartons),'',rnd2(c.tot.weight),'',rnd2(c.tot.value)]});
  return {title:o.name+' — '+o.date, header:['م','اسم الصنف','الكود','الكمية','قطع/كرتونة','الكراتين','وزن القطعة','إجمالي الوزن','سعر القطعة $','إجمالي القيمة $'], body, c, o};
}
function gvDocBody(){
  const md=gvModel(), c=md.c, o=md.o;
  return `<div class="dx" style="font-size:12px"><h2>طلبية جيفيز</h2><div class="sub">${esc(md.title)}</div>${docTableHtml(md)}
    <h3>الحاويات</h3><table><tr><th>حمولة الحاوية (كجم)</th><th>عدد الحاويات</th><th>إجمالي السعة</th><th>الوزن المطلوب</th><th>الحالة</th></tr>
    <tr class="z"><td>${fmtN(nz(o.cap))}</td><td>${fmtN(nz(o.containers))}</td><td>${fmtN(c.cap)}</td><td>${fmt1(c.tot.weight)}</td><td><b>${esc(c.status)}</b></td></tr></table></div>`;
}
function gvHasRows(){ const o=gvGet(); if(!o||!o.rows.length){ toast('الطلبية فاضية'); return false; } return true; }
function gvFile(){ return 'طلبية_جيفز_'+gvGet().date; }
function exportGvPdf(){ if(gvHasRows()) exportDocPdf(gvDocBody(),gvFile(),true); }
function exportGvImage(){ if(gvHasRows()) exportDocImage(gvDocBody(),gvFile(),true); }
function exportGvExcel(){
  if(!gvHasRows()) return; const md=gvModel(), c=md.c, o=md.o, aoa=modelToAoa(md);
  aoa.push([],['','وزن الحاوية (كجم)','',nz(o.cap)],['','عدد الحاويات','',nz(o.containers)],['','إجمالي وزن الحاويات','',c.cap],['','الفرق في الميزان','',rnd2(c.diff)],['','الحالة','',c.status]);
  saveAoaXlsx(aoa,'الطلبية',gvFile()+'.xlsx',[5,40,16,10,12,10,11,13,13,15]);
}

function fabVisible(){
  if(module==='items') return true;
  if(module==='sales') return load('_salesTab_',null)===0;
  if(module==='payroll') return load('_payTab_',null)===0;
  return false;
}

function renderInner(){
  renderNav();
  const fb=$('#fab'); if(fb) fb.style.display=fabVisible()?'':'none';
  const m=$('#main');
  if(!module){ m.innerHTML=`<div class="empty">اضغط على أحد الأيقونات فوق</div>`; return; }
  if(module==='items') renderItems(m);
  else if(module==='warehouses') renderWarehouses(m);
  else if(module==='sales') renderSales(m);
  else if(module==='gv') renderGV(m);
  else renderPayroll(m);
}
function render(top){
  const m=$('#main'); const st=m? m.scrollTop : 0;
  renderInner();
  if(m) m.scrollTop = top? 0 : st;
}

$('#refreshBtn').addEventListener('click', ()=>{ location.reload(); });
render();
</script>
</body>
