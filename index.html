<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقارير القرشي</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#1d4ed8; --blue-d:#173fb0; --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef2fb;
  --border:#dbe3f3; --text:#1b2436; --muted:#6b7690; --danger:#dc2626; --ok:#16a34a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--bg:#10131c;--panel:#181c28;--panel2:#20263a;--border:#2b3350;--text:#e7ebf5;--muted:#8b93ac} }
:root[data-theme="dark"]{--bg:#10131c;--panel:#181c28;--panel2:#20263a;--border:#2b3350;--text:#e7ebf5;--muted:#8b93ac}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
header{background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:20}
header h1{font-size:16px;margin:0;font-weight:700}
header .ver{font-size:10px;opacity:.75}
nav{display:flex;gap:4px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--border);
  overflow-x:auto;flex-shrink:0;z-index:19}
.nav-btn{flex:0 0 auto;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);
  color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.nav-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
main{flex:1;overflow-y:auto;padding:10px}
.mod{display:none}
.mod.active{display:block}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;
  display:flex;align-items:center;gap:8px}
.card .info{flex:1;min-width:0}
.card .name{font-weight:700;font-size:14px}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.act{display:flex;gap:6px}
.act button{border:none;background:var(--panel2);width:32px;height:32px;border-radius:8px;font-size:14px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:13.5px}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;
  background:var(--blue);color:#fff;font-size:24px;border:none;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:25;cursor:pointer}
.impbar{display:flex;gap:8px;margin-bottom:10px}
.impbar label,.impbar button{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-size:12.5px;font-weight:700;
  background:var(--panel2);border:1px solid var(--border);color:var(--text);cursor:pointer}
.grp{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--panel)}
.grp-h{display:flex;align-items:center;justify-content:space-between;padding:12px;cursor:pointer;font-weight:700;font-size:13.5px}
.grp-h .cnt{font-weight:400;color:var(--muted);font-size:12px}
.grp-h .arrow{transition:transform .2s;color:var(--muted)}
.grp.open .grp-h .arrow{transform:rotate(180deg)}
.grp-body{display:none;padding:0 8px 8px}
.grp.open .grp-body{display:block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:50}
.overlay.show{display:flex}
.sheet{background:var(--panel);width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:15px}
.f-row{margin-bottom:10px}
.f-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f-row input,.f-row select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px}
.f-actions{display:flex;gap:8px;margin-top:14px}
.f-actions button{flex:1;padding:12px;border-radius:9px;border:none;font-size:14px;font-weight:700;cursor:pointer}
.btn-save{background:var(--blue);color:#fff}
.btn-cancel{background:var(--panel2);color:var(--text);border:1px solid var(--border) !important}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:#1b2436;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.warn{background:#fff4e5;color:#8a5a00;border:1px solid #f0c36d;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:10px}
@media (prefers-color-scheme:dark){ .warn{background:#332a12;color:#f0c36d;border-color:#5a4a1f} }
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:8px 12px;margin:0 6px 8px 0;font-size:12.5px;cursor:pointer}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
table.rep{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel);border-radius:10px;overflow:hidden}
table.rep th,table.rep td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:center}
table.rep th{background:var(--panel2);font-size:11.5px}
table.rep td:first-child,table.rep th:first-child{text-align:right}
table.rep.stk{width:max-content;min-width:100%;overflow:visible}
table.rep.stk td:first-child,table.rep.stk th:first-child{position:sticky;right:0;z-index:1;background:var(--panel);min-width:130px;max-width:160px}
table.rep.stk th:first-child{background:var(--panel2)}
.qs{display:flex;gap:10px;font-size:12px;align-items:center;flex-wrap:wrap}
.qs small{color:var(--muted)}
.grp-h>span:first-child{flex:1;min-width:0}
.grp-h{gap:8px}
</style>
</head>
<body>
<header><h1>🧾 تقارير القرشي</h1><span style="display:flex;align-items:center;gap:8px"><span class="ver">v1.6</span><button id="refreshBtn" title="تحديث" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;width:28px;height:28px;font-size:14px;cursor:pointer">🔄</button></span></header>
<nav id="nav"></nav>
<main id="main"></main>
<button class="fab" id="fab">+</button>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function load(k,d){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){return d;} }
function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('تعذر الحفظ محلياً');} }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function openSheet(html){ $('#sheet').innerHTML=html; $('#overlay').classList.add('show'); }
function closeSheet(){ $('#overlay').classList.remove('show'); }
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });

// shared data
let items = load('items_v1', []);
let itemsByName = {}; items.forEach(i=>{ itemsByName[i.name]=i; });
let gvcodes = load('gvcodes_v1', []);
let units = load('units_v1', ['لفة','عود','متر','كرتونة','قطعة','كيلو','كيس']);
let warehouses = load('warehouses_v1', []);
if(!warehouses.length){
  warehouses=[{id:uid(),name:'طنطا',location:'',type:'مخزن رئيسي'},{id:uid(),name:'الاسكندرية',location:'',type:'مخزن رئيسي'}];
  save('warehouses_v1',warehouses);
}
let whStock = load('whStock_v1', {});      // {whId:{itemName:{balance,rolls,rods}}}
let whShortage = load('whShortage_v1', {}); // {whId:{itemName:{needed,note}}}
let customers = load('customers_v1', []);
let monthlySales = load('monthlySales_v1', {});
let monthlySector = load('monthlySector_v1', {});

const CLS_OPTS=['موزع','مبيعات جملة','مبيعات خاصة','عميل ابواب','مستبعد'];
const SECTOR_MAP={
  'قطاعات PVC كومبن':'قطاعات PVC كومبن','قطاعات كرافت لاين':'قطاعات كرافت لاين','نيو لاين':'نيو لاين',
  'اكسسورات pvc اكسا':'اكسسوارات','اكسسوارات خارجيه':'اكسسوارات','جيفيز':'اكسسوارات',
  'ابواب WPC':'ابواب WPC','شاتر':'أخرى','تصنيع':'أخرى','حشوات':'أخرى'
};
// تجميع مخصوص للتصدير: كرافت ونيو مع بعض، والاكسسوارات وكومبن مع بعض
const EXPORT_GROUP_MAP={
  'قطاعات كرافت لاين':'كرافت ونيو لاين','نيو لاين':'كرافت ونيو لاين',
  'قطاعات PVC كومبن':'اكسسوارات وكومبن','اكسسورات pvc اكسا':'اكسسوارات وكومبن',
  'اكسسوارات خارجيه':'اكسسوارات وكومبن','جيفيز':'اكسسوارات وكومبن'
};
function exportBucket(mainGroup){ return EXPORT_GROUP_MAP[mainGroup] || mainGroup || 'غير مصنف'; }

let module='items', q='', openGroups=new Set(), pendingImport=null;
let whFilterMain=new Set(), whFilterSub=new Set();
let shortMain=new Set(), shortSub=new Set();

// nav
const modules=[{id:'items',icon:'📦',name:'الأصناف'},{id:'warehouses',icon:'🏭',name:'المخازن'},{id:'sales',icon:'🧾',name:'المبيعات'},{id:'gv',icon:'📋',name:'جيفز'},{id:'payroll',icon:'💰',name:'المرتبات'}];
function renderNav(){
  $('#nav').innerHTML = modules.map(m=>`<button class="nav-btn ${m.id===module?'active':''}" onclick="switchModule('${m.id}')">${m.icon} ${m.name}</button>`).join('');
}
function switchModule(m){ module=(module===m)?null:m; q=''; openGroups=new Set(); render(); }
$('#fab').addEventListener('click', ()=>{
  if(module==='items') editItem(null);
  else if(module==='warehouses') editWarehouse(null);
  else if(module==='sales') editCustomer(null);
});

// ========== ITEMS ==========
function editItem(id){
  const it = id ? items.find(x=>x.id===id) : {id:'', name:'', mainGroup:'', subGroup:'', rollQty:'', baseName:'', color:'', unit:''};
  openSheet(`<h3>${id?'تعديل صنف':'إضافة صنف'}</h3>
    <div class="f-row"><label>اسم الصنف *</label><input id="f_name" value="${esc(it.name)}"></div>
    <div class="f-row"><label>المجموعة الرئيسية *</label><input id="f_main" list="dl_main" value="${esc(it.mainGroup)}"></div>
    <datalist id="dl_main">${[...new Set(items.map(i=>i.mainGroup).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
    <div class="f-row"><label>المجموعة الفرعية</label><input id="f_sub" value="${esc(it.subGroup)}"></div>
    <div class="f-row"><label>الصنف (النوع الأساسي)</label><input id="f_base" value="${esc(it.baseName)}"></div>
    <div class="f-row"><label>اللون</label><input id="f_color" value="${esc(it.color)}"></div>
    <div class="f-row"><label>الوحدة *</label><select id="f_unit">${units.map(u=>`<option ${u===it.unit?'selected':''}>${esc(u)}</option>`).join('')}</select></div>
    <div class="f-row"><label>محتوى اللفة</label><input id="f_roll" type="number" value="${esc(it.rollQty)}"></div>
    <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button><button class="btn-save" onclick="saveItem('${id}')">حفظ</button></div>`);
}
function saveItem(id){
  const name=$('#f_name').value.trim(), main=$('#f_main').value.trim(), unit=$('#f_unit').value;
  if(!name || !main){ toast('اسم الصنف والمجموعة مطلوبة'); return; }
  const obj={id:id||uid(), name, mainGroup:main, subGroup:$('#f_sub').value.trim(), baseName:$('#f_base').value.trim(),
    color:$('#f_color').value.trim(), unit, rollQty:$('#f_roll').value};
  if(id){ const i=items.findIndex(x=>x.id===id); items[i]=obj; } else items.unshift(obj);
  itemsByName={}; items.forEach(it=>itemsByName[it.name]=it);
  save('items_v1',items); closeSheet(); render(); toast('تم الحفظ');
}
function delItem(id){ if(!confirm('حذف الصنف؟')) return; items=items.filter(x=>x.id!==id); save('items_v1',items); render(); }

function renderItems(m){
  const tabs=['الأصناف','أكواد جيفز','الوحدات'];
  const st = load('_itemsTab_',null);
  m.innerHTML = `<div class="tabs" style="display:flex;gap:6px;margin-bottom:10px">
    ${tabs.map((t,i)=>`<button class="tab ${st===i?'active':''}" onclick="setItemsTab(${i})" style="flex:1;padding:9px;border-radius:9px;background:${st===i?'var(--blue)':'var(--panel2)'};color:${st===i?'#fff':'var(--text)'};border:1px solid var(--border);font-weight:700;font-size:13px">${t}</button>`).join('')}
  </div><div id="it_content"></div>`;
  if(st===null) $('#it_content').innerHTML=`<div class="empty">اضغط على قسم فوق</div>`;
  else if(st===0) renderItemsList($('#it_content'));
  else if(st===1) renderGvCodes($('#it_content'));
  else renderUnits($('#it_content'));
}
function setItemsTab(n){ const cur=load('_itemsTab_',null); save('_itemsTab_', cur===n?null:n); q=''; render(); }
function renderItemsList(m){
  const list = items.filter(i => !q || i.name.includes(q) || i.mainGroup.includes(q));
  const groups = [...new Set(list.map(i=>i.mainGroup||'بدون'))];
  if(q) groups.forEach(g=>openGroups.add(g));
  m.innerHTML = `
    <div class="impbar">
      <label>📥 استيراد اصناف.xlsx<input type="file" id="impItems" accept=".xlsx,.xls" style="display:none"></label>
    </div>
    <div class="toolbar"><input class="search" id="q" placeholder="بحث..." value="${esc(q)}"></div>
    ${groups.length? groups.map(g=>{
      const rows = list.filter(i=>(i.mainGroup||'بدون')===g); const open=openGroups.has(g);
      return `<div class="grp ${open?'open':''}"><div class="grp-h" onclick="toggleGroup('${g}')">
        <span>${esc(g)} <span class="cnt">(${rows.length})</span></span><span class="arrow">▾</span></div>
        <div class="grp-body">${rows.map(i=>`<div class="card"><div class="info"><div class="name">${esc(i.name)}</div>
          <div class="sub">${i.subGroup?esc(i.subGroup):''} · ${esc(i.color||'—')} · ${esc(i.unit||'—')}</div></div>
          <div class="act"><button onclick="editItem('${i.id}')">✏️</button><button onclick="delItem('${i.id}')">🗑️</button></div></div>`).join('')}</div></div>`;
    }).join('') : `<div class="empty">لا يوجد أصناف</div>`}
  `;
  $('#q').oninput=e=>{ q=e.target.value; renderItemsList(m); };
  $('#impItems').onchange=e=>{ if(e.target.files[0]) importItems(e.target.files[0]); };
}
function renderGvCodes(m){
  const list = gvcodes.filter(i => !q || i.name.includes(q) || i.code.includes(q));
  m.innerHTML = `
    <div class="impbar">
      <label>📥 استيراد أكواد جيفز<input type="file" id="impGv" accept=".xlsx,.xls" style="display:none"></label>
    </div>
    <div class="toolbar"><input class="search" id="q" placeholder="بحث..." value="${esc(q)}"></div>
    ${list.length? list.map(i=>`<div class="card"><div class="info"><div class="name">${esc(i.name)}</div>
      <div class="sub">كود: ${esc(i.code||'—')} · القطعة/كرتونة: ${esc(i.perCarton||'—')} · وزن: ${esc(i.weight||'—')}</div></div>
      <div class="act"><button onclick="editGvCode('${i.id}')">✏️</button><button onclick="delGvCode('${i.id}')">🗑️</button></div></div>`).join('') : `<div class="empty">لا توجد أكواد</div>`}
  `;
  $('#q').oninput=e=>{ q=e.target.value; renderGvCodes(m); };
  $('#impGv').onchange=e=>{ if(e.target.files[0]) importGvCodes(e.target.files[0]); };
}
function renderUnits(m){
  m.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">
      ${units.length? units.map(u=>`<span class="chip">${esc(u)} <button onclick="delUnit('${esc(u).replace(/'/g,"\\'")}')">✕</button></span>`).join('') : ''}
    </div>
    <button class="btn-save" onclick="promptAddUnit()" style="width:100%;padding:10px">➕ إضافة وحدة جديدة</button>
    ${!units.length? `<div class="empty" style="margin-top:20px">لا توجد وحدات</div>`:''}
  `;
}
function promptAddUnit(){
  openSheet(`<h3>إضافة وحدة جديدة</h3>
    <div class="f-row"><label>اسم الوحدة *</label><input id="u_name"></div>
    <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button>
    <button class="btn-save" onclick="saveUnit()">حفظ</button></div>`);
}
function saveUnit(){
  const v=$('#u_name').value.trim();
  if(!v){ toast('اكتب اسم الوحدة'); return; }
  if(units.includes(v)){ toast('الوحدة موجودة بالفعل'); return; }
  units.push(v); save('units_v1',units); closeSheet(); render(); toast('تمت الإضافة');
}
function delUnit(u){ if(!confirm('حذف الوحدة "'+u+'"؟')) return; units=units.filter(x=>x!==u); save('units_v1',units); render(); }
function editGvCode(id){
  const it = id ? gvcodes.find(x=>x.id===id) : {id:'',name:'',code:'',perCarton:'',weight:'',price:''};
  openSheet(`<h3>${id?'تعديل كود جيفز':'إضافة كود جيفز'}</h3>
    <div class="f-row"><label>اسم الصنف *</label><input id="g_name" value="${esc(it.name)}"></div>
    <div class="f-row"><label>الكود</label><input id="g_code" value="${esc(it.code)}"></div>
    <div class="f-row"><label>عدد القطع بالكرتونة</label><input id="g_pc" type="number" value="${esc(it.perCarton)}"></div>
    <div class="f-row"><label>وزن القطعة (كجم)</label><input id="g_w" type="number" step="0.001" value="${esc(it.weight)}"></div>
    <div class="f-row"><label>سعر القطعة ($)</label><input id="g_p" type="number" step="0.001" value="${esc(it.price)}"></div>
    <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button>
    <button class="btn-save" onclick="saveGvCode('${id}')">حفظ</button></div>`);
}
function saveGvCode(id){
  const name=$('#g_name').value.trim();
  if(!name){ toast('اكتب اسم الصنف'); return; }
  const obj={id:id||uid(), name, code:$('#g_code').value.trim(), perCarton:$('#g_pc').value, weight:$('#g_w').value, price:$('#g_p').value};
  if(id){ const i=gvcodes.findIndex(x=>x.id===id); gvcodes[i]=obj; } else gvcodes.unshift(obj);
  save('gvcodes_v1',gvcodes); closeSheet(); render(); toast('تم الحفظ');
}
function delGvCode(id){ if(!confirm('حذف الكود؟')) return; gvcodes=gvcodes.filter(x=>x.id!==id); save('gvcodes_v1',gvcodes); render(); }
function importGvCodes(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets['اكواد جيفز'],{header:1,defval:''});
      let list=[];
      for(let i=1;i<rows.length;i++){ const r2=rows[i]; if(!r2[0]) continue;
        list.push({id:uid(), name:String(r2[0]).trim(), code:String(r2[1]||'').trim(),
          perCarton:r2[2]||'', weight:r2[3]||'', price:r2[4]||''}); }
      if(!list.length){ toast('لا توجد بيانات'); return; }
      pendingImport={type:'gvcodes', list};
      openSheet(`<h3>تأكيد الاستيراد</h3><p style="font-size:13.5px;color:var(--muted)">
        ${list.length} كود جيفز — هيتم استبدال القائمة الحالية.</p>
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button>
        <button class="btn-save" onclick="commitImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في الملف'); }
  };
  r.readAsArrayBuffer(file);
}
function toggleGroup(g){ if(openGroups.has(g)) openGroups.delete(g); else openGroups.add(g); render(); }
function importItems(file){
  const r=new FileReader();
  r.onload=e=>{
    try{

function normUnit(u){ return String(u||'').trim().replace(/ه$/,'ة'); }
function pieceBreakdown(name, s){
  const it = itemsByName[name] || {};
  const unit = normUnit(it.unit) || '—';
  const rq = Number(it.rollQty)||0;
  const bigLbl = unit==='لفة'?'لفة':(unit==='كرتونة'?'كرتونة':'وحدة كبيرة');
  const smallLbl = unit==='لفة'?'عود':'قطعة';
  let big = Number(s.big)||0, small = Number(s.small)||0;
  if(!big && !small && rq>1){ const b=Number(s.balance)||0; big=Math.floor(b/rq); small=b%rq; }
  return {unit, bigLbl, smallLbl, big, small};
}
function balText(name, s){
  s = s || {balance:0};
  const b = pieceBreakdown(name, s);
  const bal = Number(s.balance)||0;
  const parts=[]; if(b.big) parts.push(b.big+' '+b.bigLbl); if(b.small) parts.push(b.small+' '+b.smallLbl);
  if(parts.length) return bal+' ('+parts.join(' + ')+')';
  return bal+' '+(b.unit==='—'?'':b.unit);
}

function importStock(file, whId){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sn = wb.SheetNames.find(n=>n.includes('ارصدة')||n.includes('رصيد')) || wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      const hdr = rows[0].map(h=>String(h||'').trim());
      const ni = hdr.findIndex(h=>h.includes('صنف'));
      const bi = hdr.findIndex(h=>h.includes('رصيد')||h.includes('كمية'));
      const wi = hdr.findIndex(h=>h==='مخزن'||h.includes('فرع'));
      const bigI = hdr.findIndex(h=>h.includes('لفه')||h.includes('لفة')||h.includes('كرتونه'));
      const smallI = hdr.findIndex(h=>h.includes('عود')||h.includes('قطعه')||h.includes('قطعة'));
      if(ni<0 || bi<0){ toast('لم يتم التعرف على أعمدة الصنف/الرصيد — تأكد من العناوين'); return; }
      const perWh={};
      for(let i=1;i<rows.length;i++){ const row=rows[i]; if(!row[ni]) continue;
        const targetWh = wi>=0 ? String(row[wi]||'').trim() : null;
        // لو الشيت فيه عمود مخزن، وزّع كل مخزن مذكور على المخزن المطابق بالاسم؛ غير كده كله للمخزن المفتوح حاليًا
        let destId = whId;
        if(targetWh){ const match = warehouses.find(w=>w.name===targetWh); if(match) destId=match.id; else continue; }
        perWh[destId]=perWh[destId]||{};
        perWh[destId][String(row[ni]).trim()] = {balance:row[bi]||0, big:bigI>=0?(row[bigI]||0):0, small:smallI>=0?(row[smallI]||0):0};
      }
      const totalRows = Object.values(perWh).reduce((a,m2)=>a+Object.keys(m2).length,0);
      pendingImport={type:'stock', perWh};
      const whNames = Object.keys(perWh).map(id=>(warehouses.find(w=>w.id===id)||{}).name).join('، ');
      openSheet(`<h3>تأكيد استيراد الأرصدة</h3><p style="font-size:13.5px;color:var(--muted)">
        ${totalRows} صنف${whNames?' — للمخازن: '+esc(whNames):''} — هيتم استبدال بيانات الأرصدة الحالية لهذا المخزن/المخازن.</p>
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button>
        <button class="btn-save" onclick="commitImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في الملف'); }
  };
  r.readAsArrayBuffer(file);
}

function buildGroupBreakdown(list){
  const buckets={};
  list.forEach(([name,s])=>{
    const it=itemsByName[name]||{};
    const bucket=exportBucket(it.mainGroup);
    const sub=it.subGroup||'بدون';
    buckets[bucket]=buckets[bucket]||{total:0, subs:{}};
    buckets[bucket].total+=(Number(s.order)||0);
    buckets[bucket].subs[sub]=(buckets[bucket].subs[sub]||0)+(Number(s.order)||0);
  });
  return buckets;
}
function breakdownTableHtml(buckets){

let cmpMain=new Set(), cmpSub=new Set(), cmpZero=false, colMain=new Set(), colZero=false;
const fmtN=n=>Number(n).toLocaleString('en-US');
function qtyOf(whId, name){ return Number((whStock[whId]||{})[name]?.balance)||0; }
function cmpToggleMain(v){ if(cmpMain.has(v)) cmpMain.delete(v); else cmpMain.add(v); cmpSub=new Set(); render(); }
function cmpToggleSub(v){ if(cmpSub.has(v)) cmpSub.delete(v); else cmpSub.add(v); render(); }
function colToggleMain(v){ if(colMain.has(v)) colMain.delete(v); else colMain.add(v); render(); }
function chipsHtml(list, set, fn){ return list.map(g=>`<span class="pill ${set.has(g)?'on':''}" onclick="${fn}('${esc(g).replace(/'/g,"\\'")}')">${esc(g)}</span>`).join(''); }
function floatBar(inner){ return `<div style="height:70px"></div><div style="position:sticky;bottom:0;background:var(--bg);padding:8px 0 4px;border-top:1px solid var(--border)"><div class="impbar" style="margin:0">${inner}</div></div>`; }
function noStockMsg(){ return !warehouses.some(w=>Object.keys(whStock[w.id]||{}).length); }

function buildCompareTree(){
  const tree=[];
  [...new Set(items.map(i=>i.mainGroup).filter(Boolean))].forEach(mg=>{
    if(cmpMain.size && !cmpMain.has(mg)) return;
    const mgItems=items.filter(i=>i.mainGroup===mg);
    const subs=[];
    [...new Set(mgItems.map(i=>i.subGroup||'بدون فرعية'))].forEach(sg=>{
      if(cmpSub.size && !cmpSub.has(sg)) return;
      const rows=[];
      mgItems.filter(i=>(i.subGroup||'بدون فرعية')===sg).forEach(it=>{
        const cells=warehouses.map(w=>qtyOf(w.id,it.name));
        if(!cells.reduce((a,b)=>a+b,0) && !cmpZero) return;
        rows.push({name:it.name,cells});
      });
      if(rows.length) subs.push({sg, cells:warehouses.map((w,i)=>rows.reduce((s,r)=>s+r.cells[i],0)), items:rows});
    });
    if(subs.length) tree.push({mg, cells:warehouses.map((w,i)=>subs.reduce((s,x)=>s+x.cells[i],0)), subs});
  });
  return tree;
}
function qCells(cells){
  const tot=cells.reduce((a,b)=>a+b,0);
  return warehouses.map((w,i)=>`<span><small>${esc(w.name)}</small> <b>${fmtN(cells[i])}</b></span>`).join('')+(warehouses.length>1?`<span><small>الكل</small> <b>${fmtN(tot)}</b></span>`:'');
}

  const allMain=[...new Set(items.map(i=>i.mainGroup).filter(Boolean))];
  const allSub=cmpMain.size? [...new Set(items.filter(i=>cmpMain.has(i.mainGroup)).map(i=>i.subGroup).filter(Boolean))] : [];

    }).join('') : `<div class="empty">لا توجد أصناف مطابقة</div>`}
    ${floatBar(`<button onclick="exportCompareExcel()">📊 إكسل</button><button onclick="exportComparePdf()">🖨️ PDF</button>`)}

function buildColorTable(){
  const norm=s=>String(s).trim();
  const src=items.filter(i=>i.baseName && norm(i.baseName) && i.color && norm(i.color) && (!colMain.size || colMain.has(i.mainGroup)));
  const groups={};
  src.forEach(it=>{
    const mg=it.mainGroup, bn=norm(it.baseName), c=norm(it.color);
    groups[mg]=groups[mg]||{}; groups[mg][bn]=groups[mg][bn]||{};
    const cells=groups[mg][bn][c]=groups[mg][bn][c]||warehouses.map(()=>0);
    warehouses.forEach((w,i)=>{ cells[i]+=qtyOf(w.id,it.name); });
  });
  const colorSum={};
  Object.values(groups).forEach(bs=>Object.values(bs).forEach(cs=>Object.entries(cs).forEach(([c,cells])=>{ colorSum[c]=(colorSum[c]||0)+cells.reduce((a,b)=>a+b,0); })));
  let colors=Object.keys(colorSum); if(!colZero) colors=colors.filter(c=>colorSum[c]>0);
  const pri=['ابيض','بيج']; colors.sort((a,b)=>{ const pa=pri.indexOf(a), pb=pri.indexOf(b); if(pa>=0||pb>=0) return (pa<0?99:pa)-(pb<0?99:pb); return colorSum[b]-colorSum[a]; });
  const W=warehouses.length, rows=[];
  Object.entries(groups).forEach(([mg,bs])=>{
    const list=[];
    Object.entries(bs).forEach(([bn,cs])=>{
      const flat=[]; colors.forEach(c=>{ const cells=cs[c]||warehouses.map(()=>0); flat.push(...cells); });
      const total=flat.reduce((a,b)=>a+b,0);
      if(total||colZero) list.push({type:'item',label:bn,flat,total});
    });
    if(list.length){ rows.push({type:'main',label:mg}); rows.push(...list); }
  });
  return {colors, rows, W};
}

function renderSalesReport(m){
  const months=Object.keys(monthlySales).sort();
  if(!months.length){ m.innerHTML=`<div class="empty">لا توجد شهور مستوردة</div>`; return; }
  const custByName={}; customers.forEach(c=>custByName[c.name]=c);
  const rollup={}; const distRows={}; const unclassified=new Set();
  months.forEach(mo=>{

      else{ rollup[cls]=rollup[cls]||{}; rollup[cls][mo]=(rollup[cls][mo]||0)+net; }
    });
  });
  const fmt=n=>n?Math.round(n).toLocaleString('en-US'):'—';
  let rowsHtml='';
  ['مبيعات جملة','مبيعات خاصة','عميل ابواب'].forEach(cls=>{
    if(!rollup[cls]) return;
    const tot=months.reduce((a,mo)=>a+(rollup[cls][mo]||0),0);
    rowsHtml+=`<tr><td>${cls}</td>${months.map(mo=>`<td>${fmt(rollup[cls][mo])}</td>`).join('')}<td><b>${fmt(tot)}</b></td></tr>`;
  });
  Object.keys(distRows).sort((a,b)=>{
    const ta=months.reduce((s,mo)=>s+(distRows[a][mo]||0),0), tb=months.reduce((s,mo)=>s+(distRows[b][mo]||0),0);
    return tb-ta;
  }).forEach(name=>{
    const tot=months.reduce((a,mo)=>a+(distRows[name][mo]||0),0);
    rowsHtml+=`<tr><td>${esc(name)}</td>${months.map(mo=>`<td>${fmt(distRows[name][mo])}</td>`).join('')}<td><b>${fmt(tot)}</b></td></tr>`;
  });
  m.innerHTML=`${unclassified.size? `<div class="warn">⚠️ عندك ${unclassified.size} عميل لسه غير مصنّف ومش داخل في الجدول ده — صنّفهم من تاب العملاء: ${[...unclassified].slice(0,6).join('، ')}${unclassified.size>6?' ...':''}</div>`:''}
    <div style="overflow-x:auto"><table class="rep">
    <tr><th>بيان</th>${months.map(mo=>`<th>${mo}</th>`).join('')}<th>الإجمالي</th></tr>${rowsHtml}</table></div>`;
}
function importCustomers(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sheetName = wb.SheetNames.find(n=>n.includes('عملاء')) || wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:''});
      let list=[];
      for(let i=1;i<rows.length;i++){ const r2=rows[i]; if(!r2[1]) continue;
        list.push({id:uid(), name:String(r2[1]).trim(), cls:''}); }
      if(!list.length){ toast('لا توجد بيانات'); return; }
      pendingImport={type:'customers', list};
      openSheet(`<h3>تأكيد</h3><p style="font-size:13.5px;color:var(--muted)">
        ${list.length} عميل هيتم استيرادهم بدون تصنيف — لازم تصنّفهم بنفسك بعد الحفظ من مجموعة "غير مصنف".</p>
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button>
        <button class="btn-save" onclick="commitImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في الملف'); }
  };
  r.readAsArrayBuffer(file);
}
function importSales(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sn = wb.SheetNames.find(n=>n==='Header_Wide') || wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      let hdrRow=1; while(hdrRow<rows.length && !rows[hdrRow].includes('c_name')) hdrRow++;
      const hdr = rows[hdrRow];
      const idx=n=>hdr.indexOf(n);
      const ci=idx('c_name'), ii=idx('Item_Name'), voi=idx('vout'), vii=idx('vin');
      const dataRows = rows.slice(hdrRow+1).filter(r=>r[ci]);
      const custMap={}, sectorMap={};
      const unmatchedCust=new Set(), unmatchedItems=new Set();
      const custByName={}; customers.forEach(c=>custByName[c.name]=c);
      for(const row of dataRows){
        const cname=String(row[ci]).trim(); if(!cname) continue;
        const vout=parseFloat(row[voi])||0, vin=parseFloat(row[vii])||0, net=vout-vin;
        custMap[cname]=(custMap[cname]||0)+net;
        if(!custByName[cname]) unmatchedCust.add(cname);
        const iname=String(row[ii]||'').trim();
        const it=itemsByName[iname];
        const sector = it? (SECTOR_MAP[it.mainGroup]||'أخرى') : 'غير معروف';
        if(!it && iname) unmatchedItems.add(iname);
        sectorMap[cname]=sectorMap[cname]||{}; sectorMap[cname][sector]=(sectorMap[cname][sector]||0)+net;
      }
      const total=Object.values(custMap).reduce((a,b)=>a+b,0);
      pendingImport={type:'sales', custMap, sectorMap, unmatchedCust:[...unmatchedCust], unmatchedItems:[...unmatchedItems], total};
      openSheet(`<h3>تأكيد المبيعات</h3>
        <div class="f-row"><label>الشهر (YYYY-MM) *</label><input id="s_month" placeholder="2026-01"></div>
        <p style="font-size:13px">عملاء: ${Object.keys(custMap).length} — إجمالي: ${Math.round(total).toLocaleString('en-US')}</p>
        ${pendingImport.unmatchedCust.length?`<div class="warn">عملاء جدد: ${pendingImport.unmatchedCust.slice(0,5).join('، ')}</div>`:''}
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button>
        <button class="btn-save" onclick="commitSalesImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في الملف'); }
  };
  r.readAsArrayBuffer(file);
}
function commitSalesImport(){
  const p=pendingImport; if(!p) return;
  const month=$('#s_month').value.trim();
  if(!month){ toast('اكتب الشهر'); return; }
  p.unmatchedCust.forEach(name=>{ customers.push({id:uid(),name,cls:''}); });
  save('customers_v1',customers);
  monthlySales[month]=p.custMap; monthlySector[month]=p.sectorMap;
  save('monthlySales_v1',monthlySales); save('monthlySector_v1',monthlySector);
  pendingImport=null; closeSheet(); render(); toast('تم حفظ '+month);
}

// ========== GV & PAYROLL (placeholders) ==========
function renderGV(m){ m.innerHTML=`<div class="empty">🚧 قيد البناء</div>`; }
function renderPayroll(m){ m.innerHTML=`<div class="empty">🚧 قيد البناء</div>`; }

// ========== MAIN RENDER ==========
function commitImport(){
  if(!pendingImport) return;
  if(pendingImport.type==='items'){ items=pendingImport.list; itemsByName={}; items.forEach(i=>itemsByName[i.name]=i); save('items_v1',items); }
  else if(pendingImport.type==='gvcodes'){ gvcodes=pendingImport.list; save('gvcodes_v1',gvcodes); }
  else if(pendingImport.type==='customers'){ customers=pendingImport.list; save('customers_v1',customers); }
  else if(pendingImport.type==='stock'){ Object.entries(pendingImport.perWh).forEach(([whId,map])=>{ whStock[whId]=map; }); save('whStock_v1',whStock); }
  pendingImport=null; closeSheet(); render(); toast('تم الحفظ');
}

function render(){
  renderNav();
  const m=$('#main');
  if(!module){ m.innerHTML=`<div class="empty">اضغط على أحد الأيقونات فوق</div>`; return; }
  if(module==='items') renderItems(m);
  else if(module==='warehouses') renderWarehouses(m);
  else if(module==='sales') renderSales(m);
  else if(module==='gv') renderGV(m);
  else renderPayroll(m);
}

$('#refreshBtn').addEventListener('click', ()=>{ location.reload(); });
render();
</script>
